<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>星願耶誕卡工坊｜動態卡片設計與 MP4 影片匯出</title>

  <!-- 引入 Google Fonts 繁體中文與節慶英文字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Dancing+Script:wght@700&family=Fredoka:wght@600;700&family=Great+Vibes&family=Ma+Shan+Zheng&family=Mountains+of+Christmas:wght@700&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@600;900&family=Zen+Maru+Gothic:wght@700;900&family=Zhi+Mang+Xing&display=swap" rel="stylesheet" />

  <!-- 引入 WebCodecs MP4 封裝函式庫 (首選匯出層級) -->
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js" defer></script>

  <style>
    /* ==========================================================================
       全域 CSS 變數與節慶暗夜奢華主題設定
       ========================================================================== */
    :root {
      --bg-app: #080d1a;
      --bg-surface: #111827;
      --bg-panel: #161f33;
      --bg-card: #1e293b;
      --bg-card-hover: #283548;
      --border-subtle: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --xmas-red: #e11d48;
      --xmas-red-glow: rgba(225, 29, 72, 0.35);
      --xmas-gold: #f5c451;
      --xmas-gold-dark: #d97706;
      --xmas-green: #10b981;
      --accent-blue: #38bdf8;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --topbar-h: 52px;
      --bottomnav-h: 62px;
      --drawer-h: 36vh;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea, select {
      user-select: text;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
    }

    /* 自訂捲軸 (桌面端優雅呈現) */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* ==========================================================================
       主應用程式佈局 (手機優先 Mobile-First -> 桌面端三欄自適應)
       ========================================================================== */
    .app-shell {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      height: var(--app-h, 100dvh);
      padding-top: var(--safe-top);
      background: radial-gradient(circle at 50% 0%, #17233d 0%, #080d1a 70%);
      overflow: hidden;
    }

    /* 頂部工具列 */
    .topbar {
      height: var(--topbar-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: rgba(17, 24, 39, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 40;
      gap: 6px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, #e11d48 0%, #9f1239 55%, #f59e0b 100%);
      display: grid;
      place-items: center;
      font-size: 16px;
      box-shadow: 0 2px 10px var(--xmas-red-glow);
    }
    .brand-title {
      background: linear-gradient(90deg, #fff 0%, #fde68a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    @media (max-width: 440px) {
      .brand-title { display: none; }
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }

    .ratio-select {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 99px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-primary);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.12s, background 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }
    .icon-btn:active {
      transform: scale(0.92);
    }
    .icon-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .icon-btn.active {
      background: rgba(245, 196, 81, 0.18);
      border-color: var(--xmas-gold);
      color: var(--xmas-gold);
    }

    .export-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 13px;
      height: 36px;
      border: none;
      border-radius: 99px;
      background: linear-gradient(135deg, #e11d48 0%, #be123c 55%, #d97706 100%);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--xmas-red-glow);
      white-space: nowrap;
      flex-shrink: 0;
      transition: transform 0.12s, filter 0.15s;
    }
    .export-btn:active {
      transform: scale(0.95);
    }
    .export-btn:hover {
      filter: brightness(1.08);
    }

    /* 主工作區域：手機直向排布，桌面端橫向三欄 */
    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 手機/平板底部抽屜：位於 7 大功能導覽列正下方 */
    .library-pane {
      order: 3;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 37%;
      transition: height 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 30;
      position: relative;
    }
    .library-pane.collapsed {
      height: 30px;
      overflow: hidden;
    }
    .library-pane.expanded {
      height: 52%;
    }

    /* 抽屜拖曳與高度切換把手 (僅手機/平板顯示) */
    .drawer-handle-bar {
      height: 30px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: rgba(30, 41, 59, 0.65);
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
    }
    .drawer-pill {
      width: 40px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.3);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .drawer-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--xmas-gold);
    }
    .drawer-toggle-text {
      font-size: 11px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 99px;
    }

    .panel-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 12px calc(18px + var(--safe-bottom));
      -webkit-overflow-scrolling: touch;
    }

    /* 中央畫布區域 */
    .stage-pane {
      order: 1;
      flex: 1;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      position: relative;
      overflow: hidden;
    }

    .canvas-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      touch-action: none; /* 防止觸控畫布時網頁滾動 */
    }

    #cardCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 時間軸控制列 */
    .timeline-bar {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 5px 10px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 99px;
      flex-shrink: 0;
    }
    .play-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--xmas-gold);
      color: #0b1120;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }
    .time-slider {
      flex: 1;
      accent-color: var(--xmas-gold);
      height: 4px;
      cursor: pointer;
    }
    .time-readout {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      min-width: 68px;
      text-align: right;
    }

    /* 手機版快捷浮動選取屬性列 (當選中元件時出現在畫布底部上方) */
    .mobile-quick-bar {
      display: none;
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(245, 196, 81, 0.4);
      border-radius: 99px;
      padding: 4px 8px;
      gap: 4px;
      align-items: center;
      z-index: 25;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      max-width: 94vw;
      overflow-x: auto;
    }
    .mobile-quick-bar.visible {
      display: flex;
    }
    .mq-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: none;
      border-radius: 99px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .mq-btn.danger {
      background: rgba(225, 29, 72, 0.25);
      color: #fda4af;
    }
    .mq-btn.gold {
      background: rgba(245, 196, 81, 0.22);
      color: #fde68a;
    }

    /* 7 大功能導覽列：手機/平板置於畫布正下方、抽屜正上方 7 等分滿版顯示 */
    .nav-tabs {
      order: 2;
      height: 58px;
      background: #0d1527;
      border-top: 1px solid var(--border-strong);
      border-bottom: 1px solid var(--border-subtle);
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 5px 6px;
      flex-shrink: 0;
      z-index: 40;
    }

    .nav-tab {
      width: 100%;
      height: 100%;
      border: 1px solid transparent;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      padding: 2px 1px;
      white-space: nowrap;
      overflow: hidden;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .nav-tab .tab-ico {
      font-size: 17px;
      line-height: 1;
    }
    .nav-tab.active {
      color: var(--xmas-gold);
      background: linear-gradient(135deg, rgba(245, 196, 81, 0.24), rgba(225, 29, 72, 0.2));
      border-color: rgba(245, 196, 81, 0.65);
    }

    /* 右側獨立屬性與圖層面板 (桌面版顯示，手機版透過彈窗或分頁整合) */
    .inspector-pane {
      display: none;
    }

    /* ==========================================================================
       桌面寬螢幕 (>= 960px) 三欄式工作站 (確保中央畫布恆保有足夠預覽寬度)
       ========================================================================== */
    @media (min-width: 960px) {
      .workspace {
        flex-direction: row;
      }
      .nav-tabs {
        order: 1;
        display: flex;
        flex-direction: column;
        width: 72px;
        height: 100%;
        padding: 10px 6px 0;
        border-top: none;
        border-bottom: none;
        border-right: 1px solid var(--border-subtle);
        justify-content: flex-start;
        gap: 6px;
        background: #0b1120;
      }
      .nav-tab {
        flex: none;
        width: 60px;
        height: 60px;
        border-radius: 12px;
        border: none;
        background: transparent;
        font-size: 11px;
      }
      .nav-tab.active {
        background: rgba(245, 196, 81, 0.12);
        border: none;
      }
      .nav-tab.active::after {
        content: "";
        position: absolute;
        top: 18%;
        bottom: 18%;
        left: 0;
        right: auto;
        width: 3px;
        height: auto;
        border-radius: 0 4px 4px 0;
        background: var(--xmas-gold);
      }
      .library-pane {
        order: 2;
        width: clamp(260px, 26vw, 340px);
        height: 100% !important;
        border-top: none;
        border-right: 1px solid var(--border-subtle);
      }
      .panel-scroll {
        padding: 12px;
      }
      .drawer-handle-bar {
        display: none;
      }
      .stage-pane {
        order: 3;
        min-width: 320px;
        padding: 18px;
      }
      .mobile-quick-bar {
        display: none !important;
      }
      .inspector-pane {
        order: 4;
        display: flex;
        flex-direction: column;
        width: clamp(240px, 23vw, 310px);
        height: 100%;
        background: var(--bg-surface);
        border-left: 1px solid var(--border-subtle);
        flex-shrink: 0;
      }
    }

    /* ==========================================================================
       通用 UI 元件樣式 (分類膠囊、卡片網格、滑桿、按鈕)
       ========================================================================== */
    .section-header {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-primary);
      margin: 4px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-sub {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-bottom: 4px;
      margin-bottom: 10px;
    }

    .chip {
      padding: 6px 12px;
      border-radius: 99px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip.active {
      background: linear-gradient(135deg, #f5c451, #d97706);
      color: #0b1120;
      border-color: transparent;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .item-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.15s, background 0.15s;
      position: relative;
      overflow: hidden;
    }
    .item-card:hover {
      background: var(--bg-card-hover);
    }
    .item-card:active {
      transform: scale(0.96);
    }
    .item-card.selected {
      border-color: var(--xmas-gold);
      background: rgba(245, 196, 81, 0.12);
    }

    .thumb-canvas {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      background: #0f172a;
      display: block;
    }
    .thumb-canvas.portrait {
      aspect-ratio: 3 / 4;
    }

    .item-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      line-height: 1.25;
      word-break: keep-all;
    }
    .badge-tag {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 99px;
      background: rgba(225, 29, 72, 0.9);
      color: #fff;
    }

    /* 控制項群組 */
    .control-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .control-row:last-child {
      margin-bottom: 0;
    }
    .control-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .control-val {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--xmas-gold);
      min-width: 36px;
      text-align: right;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--xmas-gold);
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: none;
      background: linear-gradient(135deg, #f5c451 0%, #d97706 100%);
      color: #0b1120;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .btn-secondary {
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .text-input, .select-input {
      width: 100%;
      background: #0f172a;
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    .text-input:focus, .select-input:focus {
      border-color: var(--xmas-gold);
    }

    .color-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: transform 0.12s;
    }
    .swatch.active {
      border-color: #fff;
      transform: scale(1.15);
      box-shadow: 0 0 0 2px var(--xmas-gold);
    }

    /* 圖層與音樂列表 */
    .layer-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .layer-item.selected {
      border-color: var(--xmas-gold);
      background: rgba(245, 196, 81, 0.1);
    }
    .layer-name {
      flex: 1;
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mini-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      font-size: 12px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .mini-btn.danger:hover {
      background: rgba(225, 29, 72, 0.4);
    }

    /* 彈窗 Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function() {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function drawStarPath(ctx, cx, cy, spikes, outerR, innerR) {
      let rot = (Math.PI / 2) * 3;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerR);
      for (let i = 0; i < spikes; i++) {
        ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
        rot += step;
        ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
        rot += step;
      }
      ctx.closePath();
    }

      ctx.save();

        ctx.save();
        ctx.rotate((i * Math.PI) / 3);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -r);
        ctx.moveTo(0, -r * 0.45);
        ctx.lineTo(-r * 0.25, -r * 0.65);
        ctx.moveTo(0, -r * 0.45);
        ctx.lineTo(r * 0.25, -r * 0.65);
        ctx.moveTo(0, -r * 0.72);
        ctx.lineTo(-r * 0.16, -r * 0.86);
        ctx.moveTo(0, -r * 0.72);
        ctx.lineTo(r * 0.16, -r * 0.86);
        ctx.stroke();
        ctx.restore();
      }

      ctx.quadraticCurveTo(cx - w * 0.28, topY + h * 0.55, cx, topY);
      ctx.closePath();
      ctx.fill();
    }

    class MusicEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.timer = null;
        this.isPlaying = false;
        this.muted = false;
        this.volume = 0.7;
        this.trackId = "we-wish";
        this.customBuffer = null;
        this.urlBufferCache = new Map();
        this.loadingPromises = new Map();
        this.bufferSource = null;
        this.noteIdx = 0;
        this.nextNoteTime = 0;
        this.previewSessionId = 0;
      }

      ensureContext() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = this.muted ? 0 : this.volume;
          this.masterGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
      }

      setVolume(vol) {
        this.volume = vol;
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setValueAtTime(this.muted ? 0 : vol, this.ctx.currentTime);
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        this.setVolume(this.volume);
        return this.muted;
      }

      getActiveBuffer(trackId) {
        if (trackId === "custom") return this.customBuffer;
        return this.urlBufferCache.get(trackId) || null;
      }

      async loadTrackBuffer(trackId) {
        if (trackId === "custom") return this.customBuffer;
        if (this.urlBufferCache.has(trackId)) return this.urlBufferCache.get(trackId);
        const track = MUSIC_TRACKS.find(t => t.id === trackId);
        if (!track || !track.mp3Url) return null;
        if (this.loadingPromises.has(trackId)) return this.loadingPromises.get(trackId);

        const promise = (async () => {
          try {
            const resp = await fetch(track.mp3Url, { mode: "cors" });
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            const arr = await resp.arrayBuffer();
            this.ensureContext();
            const buf = await this.ctx.decodeAudioData(arr);
            this.urlBufferCache.set(trackId, buf);
            return buf;
          } catch (e) {
            console.warn("無法載入線上音樂，切換回離線合成旋律：", e);
            return null;
          } finally {
            this.loadingPromises.delete(trackId);
          }
        })();
        this.loadingPromises.set(trackId, promise);
        return promise;
      }

      scheduleTone(destCtx, destNode, freq, startTime, dur, wave = "sine", vol = 0.22) {
        if (!freq) return;
        const osc = destCtx.createOscillator();
        const overtone = destCtx.createOscillator();
        const g = destCtx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(freq, startTime);
        overtone.type = "sine";
        overtone.frequency.setValueAtTime(freq * 2, startTime);
        const og = destCtx.createGain();
        og.gain.value = 0.16;
        overtone.connect(og);
        og.connect(g);
        osc.connect(g);
        g.connect(destNode);
        g.gain.setValueAtTime(0.0001, startTime);
        g.gain.exponentialRampToValueAtTime(vol, startTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, startTime + Math.max(0.08, dur * 0.92));
        osc.start(startTime);
        overtone.start(startTime);
        osc.stop(startTime + dur);
        overtone.stop(startTime + dur);
      }

      scheduleSleighBell(destCtx, destNode, startTime, vol = 0.06) {
        const bufferSize = Math.floor(destCtx.sampleRate * 0.08);
        const buf = destCtx.createBuffer(1, bufferSize, destCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
        const src = destCtx.createBufferSource();
        src.buffer = buf;
        const bp = destCtx.createBiquadFilter();
        bp.type = "highpass";
        bp.frequency.value = 5500;
        const g = destCtx.createGain();
        g.gain.value = vol;
        src.connect(bp); bp.connect(g); g.connect(destNode);
        src.start(startTime);
      }

      async startPreview(trackId, startOffset = state.musicStartOffset) {
        this.stopPreview();
        this.trackId = trackId;
        if (trackId === "none") return;
        this.ensureContext();
        this.isPlaying = true;
        const sid = ++this.previewSessionId;

        const track = MUSIC_TRACKS.find(t => t.id === trackId);
        let buf = this.getActiveBuffer(trackId);
        if (!buf && track && track.mp3Url) {
          showToast(`⏳ 正在載入 ${track.artist} 的配樂...`);
          buf = await this.loadTrackBuffer(trackId);
          if (sid !== this.previewSessionId || !this.isPlaying) return;
          if (state.activeTab === "music") renderActiveTabPanel();
        }

        if (buf) {
          const safeOffset = clamp(startOffset || 0, 0, Math.max(0, buf.duration - 0.5));
          this.bufferSource = this.ctx.createBufferSource();
          this.bufferSource.buffer = buf;
          this.bufferSource.loop = true;
          this.bufferSource.loopStart = safeOffset;
          this.bufferSource.loopEnd = buf.duration;
          this.bufferSource.connect(this.masterGain);
          this.bufferSource.start(0, safeOffset);
          return;
        }

        const synTrack = track || MUSIC_TRACKS[10];
        if (!synTrack.notes || !synTrack.notes.length) return;
        this.noteIdx = 0;
        this.nextNoteTime = this.ctx.currentTime + 0.05;
        this.timer = setInterval(() => {
          if (!this.isPlaying) return;
          while (this.nextNoteTime < this.ctx.currentTime + 0.25) {
            const [note, beats] = synTrack.notes[this.noteIdx % synTrack.notes.length];
            const sec = (60 / synTrack.bpm) * beats;
            this.scheduleTone(this.ctx, this.masterGain, NOTE_FREQ[note], this.nextNoteTime, sec, synTrack.wave, 0.2);
            if (this.noteIdx % 2 === 0 && synTrack.chords.length) {
              const ch = synTrack.chords[Math.floor(this.noteIdx / 4) % synTrack.chords.length];
              this.scheduleTone(this.ctx, this.masterGain, NOTE_FREQ[ch], this.nextNoteTime, sec * 1.8, "triangle", 0.09);
              this.scheduleSleighBell(this.ctx, this.masterGain, this.nextNoteTime, 0.045);
            }
            this.nextNoteTime += sec;
            this.noteIdx++;
          }
        }, 60);
      }

      stopPreview() {
        this.previewSessionId++;
        this.isPlaying = false;
        if (this.timer) { clearInterval(this.timer); this.timer = null; }
        if (this.bufferSource) { try { this.bufferSource.stop(); } catch (_) {} this.bufferSource = null; }
      }

      // 離線合成整段立體聲 AudioBuffer (支援起始播放點裁切與線上 MP3)，供 MP4 匯出使用
      async renderOfflineAudio(durationSec, sampleRate = 48000, startOffset = state.musicStartOffset) {
        if (this.trackId === "none" || this.muted) return null;
        let buf = this.getActiveBuffer(this.trackId);
        if (!buf) buf = await this.loadTrackBuffer(this.trackId);

        const totalSamples = Math.floor(durationSec * sampleRate);
        const offCtx = new OfflineAudioContext(2, totalSamples, sampleRate);
        const gain = offCtx.createGain();
        gain.gain.setValueAtTime(this.volume, 0);
        // 結尾 0.7 秒優雅淡出
        if (durationSec > 1) {
          gain.gain.setValueAtTime(this.volume, Math.max(0, durationSec - 0.7));
          gain.gain.linearRampToValueAtTime(0.0001, durationSec);
        }
        gain.connect(offCtx.destination);

        if (buf) {
          const safeOffset = clamp(startOffset || 0, 0, Math.max(0, buf.duration - 0.25));
          const src = offCtx.createBufferSource();
          src.buffer = buf;
          src.loop = true;
          src.loopStart = safeOffset;
          src.loopEnd = buf.duration;
          src.connect(gain);
          src.start(0, safeOffset);
          return await offCtx.startRendering();
        }

        const track = MUSIC_TRACKS.find(t => t.id === this.trackId);
        if (!track || !track.notes || !track.notes.length) return null;

        let tCursor = 0.05;
        let idx = 0;
        while (tCursor < durationSec - 0.05) {
          const [note, beats] = track.notes[idx % track.notes.length];
          const sec = (60 / track.bpm) * beats;
          this.scheduleTone(offCtx, gain, NOTE_FREQ[note], tCursor, Math.min(sec, durationSec - tCursor), track.wave, 0.24);
          if (idx % 2 === 0 && track.chords.length) {
            const ch = track.chords[Math.floor(idx / 4) % track.chords.length];
            this.scheduleTone(offCtx, gain, NOTE_FREQ[ch], tCursor, Math.min(sec * 1.8, durationSec - tCursor), "triangle", 0.11);
            this.scheduleSleighBell(offCtx, gain, tCursor, 0.055);
          }
          tCursor += sec;
          idx++;
        }
        return await offCtx.startRendering();
      }

    /* ==========================================================================
       10. 核心狀態管理 (AppState + Undo/Redo)
       ========================================================================== */
    const state = {
      ratioKey: "9:16",
      duration: 10,
      bgId: "velvet-crimson",
      customBgImage: null,
      bgFitMode: "cover",
      bgBrightness: 1,
      bgBlur: 0,
      bgVignette: 0.28,
      frameId: "royal-gold",
      particleId: "gold-dust",
      particleDensity: 1,
      particleSpeed: 1,
      musicId: "we-wish",
      musicVolume: 0.7,
      musicStartOffset: 0,
      elements: [],
      selectedId: null,
      currentTime: 0,
      isPlaying: true,
      activeTab: "templates",
      activeTplCat: "all",
      activeStickerCat: "韓風質感",
      activeBlessingCat: "溫馨祝福"
    };

    const customImageCache = new Map();
    const historyStack = [];
    let historyIndex = -1;

    function cloneElements(els) {
      return JSON.parse(JSON.stringify(els));
    }

    function snapshotState() {
      return {
        ratioKey: state.ratioKey, duration: state.duration,
        bgId: state.bgId, customBgImage: state.customBgImage, bgFitMode: state.bgFitMode,
        bgBrightness: state.bgBrightness, bgBlur: state.bgBlur, bgVignette: state.bgVignette,
        frameId: state.frameId, particleId: state.particleId,
        particleDensity: state.particleDensity, particleSpeed: state.particleSpeed,
        musicId: state.musicId, musicStartOffset: state.musicStartOffset, elements: cloneElements(state.elements)
      };
    }

    function pushHistory() {
      const snap = snapshotState();
      historyStack.splice(historyIndex + 1);
      historyStack.push(snap);
      if (historyStack.length > 35) historyStack.shift();
      historyIndex = historyStack.length - 1;
      updateUndoRedoUI();
    }

    function applySnapshot(snap) {
      Object.assign(state, {
        ratioKey: snap.ratioKey, duration: snap.duration,
        bgId: snap.bgId, customBgImage: snap.customBgImage, bgFitMode: snap.bgFitMode || "cover",
        bgBrightness: snap.bgBrightness, bgBlur: snap.bgBlur, bgVignette: snap.bgVignette,
        frameId: snap.frameId, particleId: snap.particleId,
        particleDensity: snap.particleDensity, particleSpeed: snap.particleSpeed,
        musicId: snap.musicId, musicStartOffset: snap.musicStartOffset || 0, elements: cloneElements(snap.elements)
      });
      if (!state.elements.some(e => e.id === state.selectedId)) state.selectedId = null;
      document.getElementById("ratioSelect").value = state.ratioKey;
      resizeStageCanvas();
      refreshAllPanels();
    }

    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        applySnapshot(historyStack[historyIndex]);
        updateUndoRedoUI();
      }
    }

    function redo() {
      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        applySnapshot(historyStack[historyIndex]);
        updateUndoRedoUI();
      }
    }

    function updateUndoRedoUI() {
      document.getElementById("undoBtn").disabled = historyIndex <= 0;
      document.getElementById("redoBtn").disabled = historyIndex >= historyStack.length - 1;
    }

    function loadTemplate(tplId, record = true) {
      const tpl = TEMPLATES.find(t => t.id === tplId) || TEMPLATES[0];
      state.bgId = tpl.bgId;
      state.customBgImage = null;
      state.frameId = tpl.frameId;
      state.particleId = tpl.particleId;
      state.musicId = tpl.musicId;
      state.elements = cloneElements(tpl.elements).map(el => ({ ...el, id: nextId(el.type === "text" ? "tx" : "st") }));
      state.selectedId = null;
      if (record) pushHistory();
      if (state.isPlaying && musicEngine.isPlaying) musicEngine.startPreview(state.musicId);
      refreshAllPanels();
    }

    /* ==========================================================================
       11. 決定性時間軸 Canvas 渲染引擎 (renderScene)
       ========================================================================== */
    function applyMotionTransform(ctx, motion, t, baseDim) {
      if (!motion || motion === "none") return;
      if (motion === "float") ctx.translate(0, Math.sin(t * 2.4) * baseDim * 0.014);
      else if (motion === "bounce") ctx.translate(0, -Math.abs(Math.sin(t * 4.2)) * baseDim * 0.025);
      else if (motion === "sway") ctx.rotate(Math.sin(t * 2.6) * 0.1);
      else if (motion === "pulse") { const s = 1 + Math.sin(t * 3.5) * 0.06; ctx.scale(s, s); }
      else if (motion === "spin") ctx.rotate((t * 0.65) % (Math.PI * 2));
      else if (motion === "jelly") { const sx = 1 + Math.sin(t * 5) * 0.08; ctx.scale(sx, 2 - sx); }
    }

    function drawTextBanner(ctx, bw, bh, bannerId, bannerColor) {
      if (!bannerId || bannerId === "none") return;
      const x = -bw / 2, y = -bh / 2;
      ctx.save();
      if (bannerId === "frosted") {
        ctx.fillStyle = bannerColor || "rgba(15, 23, 42, 0.62)";
        ctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
        ctx.lineWidth = 2;
        roundRectPath(ctx, x, y, bw, bh, 18);
        ctx.fill(); ctx.stroke();
      } else if (bannerId === "red-ribbon" || bannerId === "gold-ribbon") {
        const isRed = bannerId === "red-ribbon";
        ctx.fillStyle = isRed ? "#b91c1c" : "#d97706";
        // 兩端燕尾
        for (const s of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(s * (bw / 2 - 4), y + 8);
          ctx.lineTo(s * (bw / 2 + 26), y + 8);
          ctx.lineTo(s * (bw / 2 + 12), 0);
          ctx.lineTo(s * (bw / 2 + 26), y + bh - 8);
          ctx.lineTo(s * (bw / 2 - 4), y + bh - 8);
          ctx.fill();
        }
        roundRectPath(ctx, x, y, bw, bh, 8);
        ctx.fillStyle = isRed ? "#dc2626" : "#b45309";
        ctx.fill();
        ctx.strokeStyle = isRed ? "#f5c451" : "#fef08a";
        ctx.lineWidth = 2.5;
        roundRectPath(ctx, x + 4, y + 4, bw - 8, bh - 8, 6);
        ctx.stroke();
      } else if (bannerId === "pill") {
        ctx.fillStyle = "rgba(225, 29, 72, 0.85)";
        ctx.strokeStyle = "#fde68a";
        ctx.lineWidth = 2.5;
        roundRectPath(ctx, x, y, bw, bh, bh / 2);
        ctx.fill(); ctx.stroke();
      } else if (bannerId === "kraft-tag") {
        ctx.fillStyle = "#f5e6cc";
        ctx.strokeStyle = "#92400e";
        ctx.lineWidth = 2.5;
        roundRectPath(ctx, x, y, bw, bh, 10);
        ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }

    function measureAndDrawTextElement(ctx, el, t, w, h) {
      const baseDim = Math.min(w, h);
      const fontObj = FONTS.find(f => f.id === el.fontId) || FONTS[0];
      const fSize = Math.round((el.fontSize || 42) * (baseDim / 720));
      const lineH = fSize * (el.lineHeight || 1.25);
      ctx.font = `${fontObj.weight} ${fSize}px ${fontObj.family}`;

      let displayText = el.text || "";
      if (el.textAnim === "typewriter") {
        const chars = Array.from(displayText);
        const visCount = Math.max(1, Math.floor(clamp((t % 5.5) / 2.8, 0.05, 1) * chars.length));
        displayText = chars.slice(0, visCount).join("");
      }

      const lines = displayText.split("\n");
      let maxW = 60;
      lines.forEach(ln => { maxW = Math.max(maxW, ctx.measureText(ln || " ").width); });
      const totalH = Math.max(fSize, lines.length * lineH);
      const padX = fSize * 0.75, padY = fSize * 0.45;
      const boxW = maxW + padX * 2, boxH = totalH + padY * 2;

      ctx.save();
      // 套用文字專屬進場/動態效果
      if (el.textAnim === "float-up") {
        const p = clamp(t / 1.1, 0, 1);
        ctx.globalAlpha *= p;
        ctx.translate(0, (1 - p) * baseDim * 0.04);
      } else if (el.textAnim === "breathe") {
        const s = 1 + Math.sin(t * 3) * 0.05;
        ctx.scale(s, s);
      } else if (el.textAnim === "bounce") {
        ctx.translate(0, -Math.abs(Math.sin(t * 4.5)) * fSize * 0.25);
      }

      drawTextBanner(ctx, boxW, boxH, el.bannerId, el.bannerColor);

      ctx.textAlign = el.align || "center";
      ctx.textBaseline = "middle";
      const startY = -((lines.length - 1) * lineH) / 2;
      const textX = el.align === "left" ? -maxW / 2 : el.align === "right" ? maxW / 2 : 0;

      // 填充顏色或金屬流光漸層
      const gradDef = TEXT_GRADIENTS.find(g => g.id === el.gradientId);
      if (gradDef && gradDef.stops) {
        const shift = el.textAnim === "shimmer" ? Math.sin(t * 2.5) * maxW * 0.45 : 0;
        const g = ctx.createLinearGradient(-maxW / 2 + shift, -totalH / 2, maxW / 2 + shift, totalH / 2);
        gradDef.stops.forEach(([pos, col]) => g.addColorStop(pos, col));
        ctx.fillStyle = g;
      } else {
        ctx.fillStyle = el.color || "#ffffff";
      }

      lines.forEach((line, idx) => {
        const ly = startY + idx * lineH;
        if (el.textAnim === "wave") {
          const chars = Array.from(line);
          let curX = el.align === "left" ? -maxW / 2 : el.align === "right" ? maxW / 2 - ctx.measureText(line).width : -ctx.measureText(line).width / 2;
          ctx.textAlign = "left";
          chars.forEach((ch, ci) => {
            const cw = ctx.measureText(ch).width;
            const wy = ly + Math.sin(t * 5 + ci * 0.5) * (fSize * 0.15);
            if (el.strokeWidth > 0) {
              ctx.strokeStyle = el.strokeColor || "#000";
              ctx.lineWidth = el.strokeWidth * 2;
              ctx.lineJoin = "round";
              ctx.strokeText(ch, curX, wy);
            }
            ctx.shadowColor = el.glowBlur > 0 ? (el.glowColor || "#fde047") : "transparent";
            ctx.shadowBlur = el.glowBlur || 0;
            ctx.fillText(ch, curX, wy);
            ctx.shadowBlur = 0;
            curX += cw;
          });
        } else {
          if (el.strokeWidth > 0) {
            ctx.strokeStyle = el.strokeColor || "#000";
            ctx.lineWidth = el.strokeWidth * 2;
            ctx.lineJoin = "round";
            ctx.strokeText(line, textX, ly);
          }
          ctx.shadowColor = el.glowBlur > 0 ? (el.glowColor || "#fde047") : "transparent";
          ctx.shadowBlur = el.glowBlur || 0;
          ctx.fillText(line, textX, ly);
          ctx.shadowBlur = 0;
        }
      });
      ctx.restore();
      return { bw: boxW, bh: boxH };
    }

    // 等比裁切繪圖輔助函式：確保任何長寬比照片放入任何圖框時絕不拉伸變形
    function drawImageCover(ctx, img, dx, dy, dw, dh, zoom = 1, panX = 0, panY = 0) {
      const imgRatio = img.width / img.height;
      const boxRatio = dw / dh;
      let sw, sh;
      if (imgRatio > boxRatio) {
        sh = img.height / zoom;
        sw = sh * boxRatio;
      } else {
        sw = img.width / zoom;
        sh = sw / boxRatio;
      }
      const maxOffX = Math.max(0, (img.width - sw) / 2);
      const maxOffY = Math.max(0, (img.height - sh) / 2);
      const sx = clamp((img.width - sw) / 2 - panX * maxOffX, 0, img.width - sw);
      const sy = clamp((img.height - sh) / 2 - panY * maxOffY, 0, img.height - sh);
      ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
    }

    function drawHeartPath(ctx, cx, cy, size) {
      const s = size * 0.5;
      ctx.beginPath();
      ctx.moveTo(cx, cy + s * 0.9);
      ctx.bezierCurveTo(cx - s * 1.4, cy + s * 0.1, cx - s * 1.35, cy - s * 0.95, cx - s * 0.52, cy - s * 0.95);
      ctx.bezierCurveTo(cx - s * 0.15, cy - s * 0.95, cx, cy - s * 0.58, cx, cy - s * 0.45);
      ctx.bezierCurveTo(cx, cy - s * 0.58, cx + s * 0.15, cy - s * 0.95, cx + s * 0.52, cy - s * 0.95);
      ctx.bezierCurveTo(cx + s * 1.35, cy - s * 0.95, cx + s * 1.4, cy + s * 0.1, cx, cy + s * 0.9);
      ctx.closePath();
    }

    function drawArchPath(ctx, x, y, w, h) {
      const r = w / 2;
      ctx.beginPath();
      ctx.arc(x + r, y + r, r, Math.PI, 0);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      ctx.closePath();
    }

    function drawCustomImageSticker(ctx, el, img) {
      const shape = el.cropShape || "original-clean";
      const zoom = el.photoZoom || 1;
      const panX = el.photoPanX || 0;
      const panY = el.photoPanY || 0;
      const size = 168;
      const ratio = img.width / img.height;
      const dw = ratio >= 1 ? size : size * ratio;
      const dh = ratio >= 1 ? size / ratio : size;

      ctx.save();
      if (shape === "original-clean" || shape === "rect") {
        ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
        ctx.restore();
        return { bw: dw, bh: dh };
      }
      if (shape === "original-white") {
        const pad = 10;
        ctx.fillStyle = "#fffdf9"; ctx.shadowColor = "rgba(0,0,0,0.28)"; ctx.shadowBlur = 10;
        roundRectPath(ctx, -dw / 2 - pad, -dh / 2 - pad, dw + pad * 2, dh + pad * 2, 6); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
        ctx.restore();
        return { bw: dw + pad * 2, bh: dh + pad * 2 };
      }
      if (shape === "original-gold") {
        const pad = 8;
        ctx.fillStyle = "#1e293b";
        roundRectPath(ctx, -dw / 2 - pad, -dh / 2 - pad, dw + pad * 2, dh + pad * 2, 6); ctx.fill();
        ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
        ctx.strokeStyle = "#f5c451"; ctx.lineWidth = 4;
        roundRectPath(ctx, -dw / 2 - pad, -dh / 2 - pad, dw + pad * 2, dh + pad * 2, 6); ctx.stroke();
        ctx.restore();
        return { bw: dw + pad * 2, bh: dh + pad * 2 };
      }
      if (shape === "polaroid") {
        const fw = size, fh = size * 1.18, pw = size * 0.86, ph = size * 0.84;
        ctx.fillStyle = "#fffdf9"; ctx.shadowColor = "rgba(0,0,0,0.3)"; ctx.shadowBlur = 12;
        roundRectPath(ctx, -fw / 2, -fh / 2, fw, fh, 6); ctx.fill(); ctx.shadowBlur = 0;
        ctx.save();
        roundRectPath(ctx, -pw / 2, -fh / 2 + 12, pw, ph, 3); ctx.clip();
        drawImageCover(ctx, img, -pw / 2, -fh / 2 + 12, pw, ph, zoom, panX, panY);
        ctx.restore();
        // 頂端韓系格紋紙膠帶
        ctx.save(); ctx.translate(0, -fh / 2); ctx.rotate(-0.08);
        ctx.fillStyle = "rgba(225, 29, 72, 0.78)"; ctx.fillRect(-30, -9, 60, 18);
        ctx.restore();
        ctx.restore();
        return { bw: fw, bh: fh };
      }
      if (shape === "circle") {
        const r = size * 0.48;
        ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
        drawImageCover(ctx, img, -r, -r, r * 2, r * 2, zoom, panX, panY);
        ctx.restore();
        ctx.strokeStyle = "#f5c451"; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = "#f5c451"; roundRectPath(ctx, -12, -r - 12, 24, 14, 4); ctx.fill();
        ctx.restore();
        return { bw: r * 2 + 12, bh: r * 2 + 20 };
      }
      if (shape === "wreath") {
        const r = size * 0.42;
        ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
        drawImageCover(ctx, img, -r, -r, r * 2, r * 2, zoom, panX, panY);
        ctx.restore();
        ctx.strokeStyle = "#15803d"; ctx.lineWidth = 14;
        ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = "#22c55e"; ctx.lineWidth = 6; ctx.setLineDash([8, 12]);
        ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
        drawBow(ctx, 0, -r - 4, 22, "#e11d48", "#fda4af");
        ctx.restore();
        return { bw: (r + 14) * 2, bh: (r + 16) * 2 };
      }
      if (shape === "heart") {
        ctx.save(); drawHeartPath(ctx, 0, 4, size); ctx.clip();
        drawImageCover(ctx, img, -size * 0.55, -size * 0.55, size * 1.1, size * 1.1, zoom, panX, panY);
        ctx.restore();
        ctx.strokeStyle = "#fda4af"; ctx.lineWidth = 6;
        drawHeartPath(ctx, 0, 4, size); ctx.stroke();
        ctx.restore();
        return { bw: size, bh: size };
      }
      if (shape === "arch") {
        const aw = size * 0.88, ah = size * 1.06;
        ctx.fillStyle = "#e7d3ba";
        drawArchPath(ctx, -aw / 2 - 8, -ah / 2 - 8, aw + 16, ah + 16); ctx.fill();
        ctx.save(); drawArchPath(ctx, -aw / 2, -ah / 2, aw, ah); ctx.clip();
        drawImageCover(ctx, img, -aw / 2, -ah / 2, aw, ah, zoom, panX, panY);
        ctx.restore();
        ctx.strokeStyle = "#8d6e63"; ctx.lineWidth = 4;
        drawArchPath(ctx, -aw / 2 - 8, -ah / 2 - 8, aw + 16, ah + 16); ctx.stroke();
        ctx.restore();
        return { bw: aw + 16, bh: ah + 16 };
      }
      if (shape === "stamp") {
        const sw = size * 0.92, sh = size * 1.06;
        ctx.fillStyle = "#fffdf5";
        roundRectPath(ctx, -sw / 2 - 12, -sh / 2 - 12, sw + 24, sh + 24, 4); ctx.fill();
        ctx.strokeStyle = "#d97706"; ctx.lineWidth = 4; ctx.setLineDash([6, 8]);
        roundRectPath(ctx, -sw / 2 - 10, -sh / 2 - 10, sw + 20, sh + 20, 4); ctx.stroke(); ctx.setLineDash([]);
        ctx.save(); ctx.beginPath(); ctx.rect(-sw / 2, -sh / 2, sw, sh); ctx.clip();
        drawImageCover(ctx, img, -sw / 2, -sh / 2, sw, sh, zoom, panX, panY);
        ctx.restore();
        ctx.restore();
        return { bw: sw + 24, bh: sh + 24 };
      }
      if (shape === "scallop") {
        const r = size * 0.44;
        ctx.fillStyle = "#fff8ee"; ctx.strokeStyle = "#d4a373"; ctx.lineWidth = 3;
        ctx.beginPath();
        for (let i = 0; i < 16; i++) {
          const a = (i / 16) * Math.PI * 2;
          const cx = Math.cos(a) * r, cy = Math.sin(a) * r;
          ctx.arc(cx, cy, 16, a - 0.8, a + 0.8);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r - 4, 0, Math.PI * 2); ctx.clip();
        drawImageCover(ctx, img, -(r - 4), -(r - 4), (r - 4) * 2, (r - 4) * 2, zoom, panX, panY);
        ctx.restore();
        ctx.restore();
        return { bw: r * 2 + 24, bh: r * 2 + 24 };
      }
      if (shape === "star") {
        ctx.save(); drawStarPath(ctx, 0, 0, 5, size * 0.56, size * 0.27); ctx.clip();
        drawImageCover(ctx, img, -size * 0.56, -size * 0.56, size * 1.12, size * 1.12, zoom, panX, panY);
        ctx.restore();
        ctx.strokeStyle = "#fef08a"; ctx.lineWidth = 5;
        drawStarPath(ctx, 0, 0, 5, size * 0.56, size * 0.27); ctx.stroke();
        ctx.restore();
        return { bw: size * 1.1, bh: size * 1.1 };
      }
      // snowglobe
      const r = size * 0.44;
      ctx.save(); ctx.beginPath(); ctx.arc(0, -10, r, 0, Math.PI * 2); ctx.clip();
      drawImageCover(ctx, img, -r, -10 - r, r * 2, r * 2, zoom, panX, panY);
      ctx.restore();
      ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, -10, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#78350f"; roundRectPath(ctx, -r * 0.72, r - 18, r * 1.44, 28, 8); ctx.fill();
      ctx.fillStyle = "#f5c451"; roundRectPath(ctx, -r * 0.45, r - 11, r * 0.9, 12, 4); ctx.fill();
      ctx.restore();
      return { bw: r * 2 + 12, bh: r * 2 + 30 };
    }

    // 記錄每個元件在當前畫布上的互動邊界盒 (供觸控與滑鼠點擊檢測)
    let lastRenderedBoxes = [];

    function renderScene(ctx, sceneState, t, w, h, interactive = false, snapGuides = null) {
      ctx.clearRect(0, 0, w, h);

      // 1. 繪製背景 (使用者自訂照片不變形渲染或程序化背景)
      if (sceneState.customBgImage && customImageCache.has(sceneState.customBgImage)) {
        const img = customImageCache.get(sceneState.customBgImage);
        ctx.fillStyle = "#0b1120";
        ctx.fillRect(0, 0, w, h);
        ctx.save();
        const filters = [];
        if (sceneState.bgBrightness !== 1) filters.push(`brightness(${sceneState.bgBrightness})`);
        if (sceneState.bgBlur > 0) filters.push(`blur(${sceneState.bgBlur}px)`);
        if (filters.length && "filter" in ctx) ctx.filter = filters.join(" ");
        const scale = sceneState.bgFitMode === "contain"
          ? Math.min(w / img.width, h / img.height)
          : Math.max(w / img.width, h / img.height);
        const dw = img.width * scale, dh = img.height * scale;
        ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
        ctx.restore();
        if (sceneState.bgVignette > 0) {
          const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.2, w / 2, h / 2, Math.max(w, h) * 0.72);
          vg.addColorStop(0, "rgba(0,0,0,0)");
          vg.addColorStop(1, `rgba(0,0,0,${sceneState.bgVignette})`);
          ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);
        }
      } else {
        const bg = BACKGROUNDS.find(b => b.id === sceneState.bgId) || BACKGROUNDS[0];
        bg.draw(ctx, w, h, t);
      }

      // 2. 底層極光粒子 (若選擇極光)
      const pt = PARTICLES.find(p => p.id === sceneState.particleId);
      if (pt && pt.id === "aurora-flow") {
        pt.draw(ctx, w, h, t, sceneState.particleDensity, sceneState.particleSpeed);
      }

      // 3. 繪製所有圖層元件
      const baseDim = Math.min(w, h);
      const stickerBaseScale = baseDim / 640;
      const boxes = [];

      sceneState.elements.forEach(el => {
        const cx = el.x * w;
        const cy = el.y * h;
        const isFrozen = !!el.freezeAnim;
        const elT = isFrozen ? 0.8 : t;
        ctx.save();
        ctx.globalAlpha = clamp(el.opacity ?? 1, 0, 1);
        ctx.translate(cx, cy);
        ctx.rotate(el.rotation || 0);
        if (!isFrozen) applyMotionTransform(ctx, el.motion, elT, baseDim);

        let boxW = 140, boxH = 140;
        if (el.type === "text") {
          const sx = (el.flipX ? -1 : 1) * (el.scale || 1);
          const sy = (el.flipY ? -1 : 1) * (el.scale || 1);
          ctx.scale(sx, sy);
          const m = measureAndDrawTextElement(ctx, el, isFrozen ? 1.5 : elT, w, h);
          boxW = m.bw * (el.scale || 1);
          boxH = m.bh * (el.scale || 1);
        } else {
          const s = (el.scale || 1) * stickerBaseScale;
          ctx.scale((el.flipX ? -1 : 1) * s, (el.flipY ? -1 : 1) * s);
          if (el.type === "static") {
            const st = STATIC_STICKERS.find(item => item.id === el.stickerId);
            if (st) st.draw(ctx);
          } else if (el.type === "animated") {
            const am = ANIMATED_STICKERS.find(item => item.id === el.stickerId);
            if (am) am.draw(ctx, elT);
          } else if (el.type === "custom-image") {
            const img = customImageCache.get(el.imageUrl);
            if (img) {
              const pm = drawCustomImageSticker(ctx, el, img);
              boxW = pm.bw * Math.abs(s);
              boxH = pm.bh * Math.abs(s);
            }
          }
          if (el.type !== "custom-image") {
            boxW = 165 * Math.abs(s);
            boxH = 165 * Math.abs(s);
          }
        }
        ctx.restore();
        boxes.push({ id: el.id, cx, cy, w: boxW, h: boxH, rot: el.rotation || 0, type: el.type });
      });

      if (interactive) lastRenderedBoxes = boxes;

      // 4. 繪製前景環境粒子特效
      if (pt && pt.id !== "aurora-flow" && pt.id !== "none") {
        pt.draw(ctx, w, h, t, sceneState.particleDensity, sceneState.particleSpeed);
      }

      // 5. 繪製裝飾邊框
      const fr = FRAMES.find(f => f.id === sceneState.frameId);
      if (fr) fr.draw(ctx, w, h, t);

      // 6. 互動編輯模式：中心磁吸線與選取控制框 (絕不寫入匯出影片)
      if (interactive) {
        if (snapGuides) {
          ctx.save();
          ctx.strokeStyle = "#f5c451";
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 6]);
          if (snapGuides.x) { ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.stroke(); }
          if (snapGuides.y) { ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke(); }
          ctx.restore();
        }
        const selBox = boxes.find(b => b.id === sceneState.selectedId);
        if (selBox) drawSelectionOverlay(ctx, selBox, baseDim);
      }
    }

    function drawSelectionOverlay(ctx, box, baseDim) {
      const hw = box.w / 2 + 10, hh = box.h / 2 + 10;
      const handleR = clamp(baseDim * 0.032, 16, 26);
      ctx.save();
      ctx.translate(box.cx, box.cy);
      ctx.rotate(box.rot);

      ctx.strokeStyle = "#f5c451";
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 6]);
      ctx.strokeRect(-hw, -hh, hw * 2, hh * 2);
      ctx.setLineDash([]);

      const handles = [
        { x: -hw, y: -hh, bg: "#e11d48", label: "✕" }, // 左上刪除
        { x: hw,  y: -hh, bg: "#0284c7", label: "⧉" }, // 右上複製
        { x: hw,  y: hh,  bg: "#f5c451", label: "⤡", fg: "#0f172a" }, // 右下縮放旋轉
        { x: -hw, y: hh,  bg: "#10b981", label: box.type === "text" ? "✎" : "▲" } // 左下編輯/置頂
      ];
      handles.forEach(hd => {
        ctx.fillStyle = hd.bg;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(hd.x, hd.y, handleR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = hd.fg || "#ffffff";
        ctx.font = `900 ${Math.round(handleR * 1.05)}px sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(hd.label, hd.x, hd.y + 1);
      });
      ctx.restore();
    }

    /* ==========================================================================
       12. 觸控與滑鼠畫布互動系統 (單指拖曳、磁吸、四角控制點、雙指縮放旋轉、雙擊文字)
       ========================================================================== */
    const canvas = document.getElementById("cardCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const canvasContainer = document.getElementById("canvasContainer");

    const activePointers = new Map();
    let dragMode = null; // "move" | "transform" | "pinch" | null
    let dragStart = null;
    let snapGuides = null;
    let lastTapTime = 0;
    let lastTapId = null;

    function getCanvasPoint(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * canvas.width,
        y: ((clientY - rect.top) / rect.height) * canvas.height
      };
    }

    function hitTestHandle(px, py, box) {
      const baseDim = Math.min(canvas.width, canvas.height);
      const hitR = clamp(baseDim * 0.055, 24, 38);
      const hw = box.w / 2 + 10, hh = box.h / 2 + 10;
      const dx = px - box.cx, dy = py - box.cy;
      const cos = Math.cos(-box.rot), sin = Math.sin(-box.rot);
      const lx = dx * cos - dy * sin;
      const ly = dx * sin + dy * cos;

      const corners = [
        { act: "delete", x: -hw, y: -hh },
        { act: "duplicate", x: hw, y: -hh },
        { act: "transform", x: hw, y: hh },
        { act: "secondary", x: -hw, y: hh }
      ];
      for (const c of corners) {
        if (Math.hypot(lx - c.x, ly - c.y) <= hitR) return c.act;
      }
      return null;
    }

    function hitTestElement(px, py) {
      for (let i = lastRenderedBoxes.length - 1; i >= 0; i--) {
        const b = lastRenderedBoxes[i];
        const dx = px - b.cx, dy = py - b.cy;
        const cos = Math.cos(-b.rot), sin = Math.sin(-b.rot);
        const lx = dx * cos - dy * sin;
        const ly = dx * sin + dy * cos;
        if (Math.abs(lx) <= b.w / 2 + 12 && Math.abs(ly) <= b.h / 2 + 12) return b;
      }
      return null;
    }

    function duplicateElement(el) {
      const copy = JSON.parse(JSON.stringify(el));
      copy.id = nextId(copy.type === "text" ? "tx" : "st");
      copy.x = clamp(copy.x + 0.04, 0.08, 0.92);
      copy.y = clamp(copy.y + 0.04, 0.08, 0.92);
      state.elements.push(copy);
      state.selectedId = copy.id;
      pushHistory();
      refreshInspectorAndQuickBar();
    }

    function deleteElement(id) {
      state.elements = state.elements.filter(e => e.id !== id);
      if (state.selectedId === id) state.selectedId = null;
      pushHistory();
      refreshInspectorAndQuickBar();
    }

    function bringElementForward(id) {
      const idx = state.elements.findIndex(e => e.id === id);
      if (idx >= 0 && idx < state.elements.length - 1) {
        const [item] = state.elements.splice(idx, 1);
        state.elements.push(item);
        pushHistory();
        refreshInspectorAndQuickBar();
        showToast("已將元件移至最上層");
      }
    }

    canvas.addEventListener("pointerdown", (e) => {
      canvas.setPointerCapture(e.pointerId);
      const pt = getCanvasPoint(e.clientX, e.clientY);
      activePointers.set(e.pointerId, pt);

      // 雙指捏合縮放與旋轉
      if (activePointers.size === 2 && state.selectedId) {
        const pts = Array.from(activePointers.values());
        const el = state.elements.find(item => item.id === state.selectedId);
        if (el) {
          dragMode = "pinch";
          dragStart = {
            dist: Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1,
            angle: Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x),
            initScale: el.scale || 1,
            initRot: el.rotation || 0
          };
        }
        return;
      }

      if (activePointers.size === 1) {
        // 1. 優先檢測已選取元件的四個角落大按鈕
        if (state.selectedId) {
          const selBox = lastRenderedBoxes.find(b => b.id === state.selectedId);
          if (selBox) {
            const act = hitTestHandle(pt.x, pt.y, selBox);
            if (act === "delete") { deleteElement(selBox.id); activePointers.clear(); return; }
            if (act === "duplicate") {
              const el = state.elements.find(i => i.id === selBox.id);
              if (el) duplicateElement(el);
              activePointers.clear(); return;
            }
            if (act === "secondary") {
              const el = state.elements.find(i => i.id === selBox.id);
              if (el) {
                if (el.type === "text") openEditModalForElement(el);
                else bringElementForward(el.id);
              }
              activePointers.clear(); return;
            }
            if (act === "transform") {
              const el = state.elements.find(i => i.id === selBox.id);
              if (el) {
                dragMode = "transform";
                dragStart = {
                  cx: selBox.cx, cy: selBox.cy,
                  dist: Math.hypot(pt.x - selBox.cx, pt.y - selBox.cy) || 1,
                  angle: Math.atan2(pt.y - selBox.cy, pt.x - selBox.cx),
                  initScale: el.scale || 1,
                  initRot: el.rotation || 0
                };
              }
              return;
            }
          }
        }

        // 2. 檢測是否點到任何元件
        const hit = hitTestElement(pt.x, pt.y);
        if (hit) {
          const now = performance.now();
          if (hit.id === lastTapId && now - lastTapTime < 340) {
            const el = state.elements.find(i => i.id === hit.id);
            if (el) openEditModalForElement(el);
            lastTapTime = 0;
            return;
          }
          lastTapTime = now;
          lastTapId = hit.id;

          state.selectedId = hit.id;
          const el = state.elements.find(i => i.id === hit.id);
          dragMode = "move";
          dragStart = { px: pt.x, py: pt.y, initX: el.x, initY: el.y, moved: false };
          refreshInspectorAndQuickBar();
        } else {
          state.selectedId = null;
          dragMode = null;
          refreshInspectorAndQuickBar();
        }
      }
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!activePointers.has(e.pointerId)) return;
      const pt = getCanvasPoint(e.clientX, e.clientY);
      activePointers.set(e.pointerId, pt);

      const el = state.elements.find(i => i.id === state.selectedId);
      if (!el || !dragStart) return;

      if (dragMode === "pinch" && activePointers.size === 2) {
        const pts = Array.from(activePointers.values());
        const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1;
        const angle = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
        el.scale = clamp(dragStart.initScale * (dist / dragStart.dist), 0.25, 3.5);
        el.rotation = dragStart.initRot + (angle - dragStart.angle);
        dragStart.moved = true;
      } else if (dragMode === "move" && activePointers.size === 1) {
        const dx = (pt.x - dragStart.px) / canvas.width;
        const dy = (pt.y - dragStart.py) / canvas.height;
        if (Math.hypot(dx, dy) > 0.004) dragStart.moved = true;
        let nx = clamp(dragStart.initX + dx, 0.03, 0.97);
        let ny = clamp(dragStart.initY + dy, 0.03, 0.97);
        // 中心十字線磁吸
        const snapX = Math.abs(nx - 0.5) < 0.018;
        const snapY = Math.abs(ny - 0.5) < 0.018;
        if (snapX) nx = 0.5;
        if (snapY) ny = 0.5;
        snapGuides = (snapX || snapY) ? { x: snapX, y: snapY } : null;
        el.x = nx;
        el.y = ny;
      } else if (dragMode === "transform" && activePointers.size === 1) {
        const dist = Math.hypot(pt.x - dragStart.cx, pt.y - dragStart.cy) || 1;
        const angle = Math.atan2(pt.y - dragStart.cy, pt.x - dragStart.cx);
        el.scale = clamp(dragStart.initScale * (dist / dragStart.dist), 0.25, 3.5);
        el.rotation = dragStart.initRot + (angle - dragStart.angle);
        dragStart.moved = true;
      }
    });

    function endPointer(e) {
      activePointers.delete(e.pointerId);
      if (activePointers.size === 0) {
        if (dragMode && dragStart && dragStart.moved) {
          pushHistory();
          refreshInspectorAndQuickBar();
        }
        dragMode = null;
        dragStart = null;
        snapGuides = null;
      }
    }
    canvas.addEventListener("pointerup", endPointer);
    canvas.addEventListener("pointercancel", endPointer);

    /* ==========================================================================
       13. 多層級真實 MP4 匯出引擎 (WebCodecs + mp4-muxer 首選，MediaRecorder 備援)
       ========================================================================== */
    let exportCancelled = false;
    let lastExportUrl = null;
    let lastExportFile = null;

    function updateExportUI(percent, status, frameInfo = "") {
      document.getElementById("exportProgressFill").style.width = `${percent}%`;
      document.getElementById("exportPercentText").textContent = `${Math.round(percent)}%`;
      document.getElementById("exportStatusText").textContent = status;
      if (frameInfo) document.getElementById("exportFrameInfo").textContent = frameInfo;
    }

    function showExportResult(blob, ext, codecLabel, w, h) {
      if (lastExportUrl) URL.revokeObjectURL(lastExportUrl);
      lastExportUrl = URL.createObjectURL(blob);
      const fileName = `XmasCard_${w}x${h}.${ext}`;
      lastExportFile = new File([blob], fileName, { type: blob.type });

    let activeExportAbort = null;

    function withTimeout(promise, ms, label) {
      let timer = null;
      return Promise.race([
        promise,
        new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error(label || "操作逾時")), ms);
        })
      ]).finally(() => { if (timer) clearTimeout(timer); });
    }

    async function findSupportedVideoConfig(w, h, fps) {
      if (typeof VideoEncoder === "undefined") return null;
      const profiles = ["avc1.42002a", "avc1.4d002a", "avc1.64002a", "avc1.420028", "avc1.42E01F", "avc1.42001f"];
      const modes = ["prefer-software", "no-preference"];
      for (const hardwareAcceleration of modes) {
        for (const codec of profiles) {
          const cfg = {
            codec, width: w, height: h,
            bitrate: 4_500_000, framerate: fps,
            latencyMode: "realtime",
            hardwareAcceleration,
            avc: { format: "avc" }
          };
          try {
            const res = await VideoEncoder.isConfigSupported(cfg);
            if (res.supported) return cfg;
          } catch (_) {}
        }
      }
      return null;
    }

    async function exportWithWebCodecs(w, h, duration, fps) {
      const muxLib = window.Mp4Muxer;
      if (!muxLib || !muxLib.Muxer) return null;
      const vConfig = await findSupportedVideoConfig(w, h, fps);
      if (!vConfig) return null;

      updateExportUI(4, "正在離線合成耶誕配樂...", `0 / ${duration * fps} 幀`);
      const sampleRate = 48000;
      let audioBuf = null;
      try { audioBuf = await musicEngine.renderOfflineAudio(duration, sampleRate); } catch (_) { audioBuf = null; }

      let useAudio = false;
      const aConfig = { codec: "mp4a.40.2", sampleRate, numberOfChannels: 2, bitrate: 128_000 };
      if (audioBuf && typeof AudioEncoder !== "undefined") {
        try {
          const res = await AudioEncoder.isConfigSupported(aConfig);
          useAudio = !!res.supported;
        } catch (_) { useAudio = false; }
      }

      const muxer = new muxLib.Muxer({
        target: new muxLib.ArrayBufferTarget(),
        video: { codec: "avc", width: w, height: h },
        audio: useAudio ? { codec: "aac", numberOfChannels: 2, sampleRate } : undefined,
        fastStart: "in-memory"
      });

      let encError = null;
      let videoChunksCount = 0;
      let videoEncoder = null;
      let audioEncoder = null;

      activeExportAbort = () => {
        try { if (videoEncoder && videoEncoder.state !== "closed") videoEncoder.close(); } catch (_) {}
        try { if (audioEncoder && audioEncoder.state !== "closed") audioEncoder.close(); } catch (_) {}
      };

      try {
        videoEncoder = new VideoEncoder({
          output: (chunk, meta) => {
            try {
              muxer.addVideoChunk(chunk, meta);
              videoChunksCount++;
            } catch (e) { encError = e; }
          },
          error: (e) => { encError = e; }
        });
        videoEncoder.configure(vConfig);

        if (useAudio) {
          audioEncoder = new AudioEncoder({
            output: (chunk, meta) => {
              try { muxer.addAudioChunk(chunk, meta); } catch (e) { encError = e; }
            },
            error: (e) => { console.warn("AudioEncoder error:", e); }
          });
          audioEncoder.configure(aConfig);
        }

        // 若使用音訊，先分段編碼 AudioBuffer 為 AudioData（含佇列背壓控制）
        if (useAudio && audioEncoder && audioBuf) {
          updateExportUI(8, "正在編碼立體聲 AAC 音軌...");
          const chunkFrames = 4096;
          const totalSamples = audioBuf.length;
          const left = audioBuf.getChannelData(0);
          const right = audioBuf.getChannelData(1);
          for (let offset = 0; offset < totalSamples; offset += chunkFrames) {
            if (exportCancelled) throw new Error("CANCELLED");
            if (encError) throw encError;
            const len = Math.min(chunkFrames, totalSamples - offset);
            const planar = new Float32Array(len * 2);
            planar.set(left.subarray(offset, offset + len), 0);
            planar.set(right.subarray(offset, offset + len), len);
            const ad = new AudioData({
              format: "f32-planar",
              sampleRate,
              numberOfFrames: len,
              numberOfChannels: 2,
              timestamp: Math.round((offset / sampleRate) * 1_000_000),
              data: planar
            });
            audioEncoder.encode(ad);
            ad.close();
            while (audioEncoder.encodeQueueSize > 8) {
              if (exportCancelled) throw new Error("CANCELLED");
              await new Promise(r => setTimeout(r, 8));
            }
          }
        }

        // 離線 Canvas 逐步精確渲染每一幀 (含佇列背壓保護與不掉幀渲染)
        const offCanvas = document.createElement("canvas");
        offCanvas.width = w;
        offCanvas.height = h;
        const offCtx = offCanvas.getContext("2d", { alpha: false });
        const totalFrames = Math.round(duration * fps);

        for (let i = 0; i < totalFrames; i++) {
          if (exportCancelled) throw new Error("CANCELLED");
          if (encError) throw encError;
          const t = i / fps;
          renderScene(offCtx, state, t, w, h, false);

          const frame = new VideoFrame(offCanvas, {
            timestamp: Math.round((i * 1_000_000) / fps),
            duration: Math.round(1_000_000 / fps)
          });
          videoEncoder.encode(frame, { keyFrame: i % 30 === 0 });
          frame.close();

          const waitStart = performance.now();
          while (videoEncoder.encodeQueueSize > 4) {
            if (exportCancelled) throw new Error("CANCELLED");
            if (encError) throw encError;
            if (performance.now() - waitStart > 2500) throw new Error("VideoEncoder queue timeout");
            await new Promise(r => setTimeout(r, 12));
          }

          if (i >= 20 && videoChunksCount === 0 && videoEncoder.encodeQueueSize > 8) {
            throw new Error("VideoEncoder produced no chunks");
          }

          if (i % 3 === 0 || i === totalFrames - 1) {
            const pct = 10 + (i / totalFrames) * 85;
            updateExportUI(pct, "正在逐幀進行 H.264 視訊編碼...", `第 ${i + 1} / ${totalFrames} 幀`);
            await new Promise(r => setTimeout(r, 0));
          }
        }

        updateExportUI(97, "正在封裝標準 MP4 影片檔...");
        if (encError) throw encError;
        await withTimeout(videoEncoder.flush(), 4000, "VideoEncoder flush timeout");
        if (audioEncoder) {
          await withTimeout(audioEncoder.flush(), 4000, "AudioEncoder flush timeout");
        }
        if (exportCancelled) throw new Error("CANCELLED");
        if (videoChunksCount === 0) throw new Error("VideoEncoder output empty");

        muxer.finalize();
        const blob = new Blob([muxer.target.buffer], { type: "video/mp4" });
        return {
          blob, ext: "mp4",
          codecLabel: useAudio ? "H.264 + AAC 雙軌標準 MP4" : "H.264 標準 MP4"
        };
      } finally {
        activeExportAbort = null;
        try { if (videoEncoder && videoEncoder.state !== "closed") videoEncoder.close(); } catch (_) {}
        try { if (audioEncoder && audioEncoder.state !== "closed") audioEncoder.close(); } catch (_) {}
      }
    }

    async function exportWithMediaRecorder(w, h, duration, fps) {
      const mimes = [
        { mime: "video/mp4;codecs=avc1,mp4a.40.2", ext: "mp4", label: "MP4 串流錄製" },
        { mime: "video/mp4", ext: "mp4", label: "MP4 原生錄製" },
        { mime: "video/webm;codecs=h264,opus", ext: "webm", label: "WebM (H.264)" },
        { mime: "video/webm", ext: "webm", label: "WebM 備援錄製" }
      ];
      const chosen = mimes.find(m => MediaRecorder.isTypeSupported(m.mime)) || { mime: "", ext: "webm", label: "預設錄製" };

      const offCanvas = document.createElement("canvas");
      offCanvas.width = w; offCanvas.height = h;
      const offCtx = offCanvas.getContext("2d", { alpha: false });
      const stream = offCanvas.captureStream(fps);

      // 準備音訊軌混流
      let audioCtx = null, audioSrc = null;
      const audioBuf = await musicEngine.renderOfflineAudio(duration, 48000).catch(() => null);
      if (audioBuf) {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        const dest = audioCtx.createMediaStreamDestination();
        audioSrc = audioCtx.createBufferSource();
        audioSrc.buffer = audioBuf;
        audioSrc.connect(dest);
        dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
      }

      const rec = new MediaRecorder(stream, chosen.mime ? { mimeType: chosen.mime, videoBitsPerSecond: 4_000_000 } : undefined);
      const chunks = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };

      return await new Promise((resolve, reject) => {
        activeExportAbort = () => {
          try { if (rec.state !== "inactive") rec.stop(); } catch (_) {}
          if (audioSrc) try { audioSrc.stop(); } catch (_) {}
          if (audioCtx) try { audioCtx.close(); } catch (_) {}
          reject(new Error("CANCELLED"));
        };
        rec.onstop = () => {
          activeExportAbort = null;
          if (audioSrc) try { audioSrc.stop(); } catch (_) {}
          if (audioCtx) try { audioCtx.close(); } catch (_) {}
          if (exportCancelled) { reject(new Error("CANCELLED")); return; }
          const blob = new Blob(chunks, { type: chosen.mime || "video/mp4" });
          resolve({ blob, ext: chosen.ext, codecLabel: chosen.label });
        };
        rec.onerror = (e) => reject(e.error || new Error("MediaRecorder 失敗"));

        rec.start(200);
        if (audioSrc) audioSrc.start();
        const startTs = performance.now();
        function step() {
          if (exportCancelled) { rec.stop(); reject(new Error("CANCELLED")); return; }
          const elapsed = (performance.now() - startTs) / 1000;
          if (elapsed >= duration) {
            updateExportUI(100, "正在完成影片封裝...");
            rec.stop();
            return;
          }
          renderScene(offCtx, state, elapsed, w, h, false);
          updateExportUI((elapsed / duration) * 98, "正在即時錄製卡片動畫與音樂...", `${elapsed.toFixed(1)}s / ${duration}s`);
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      });
    }

    async function startExportMP4() {
      const wasPlaying = state.isPlaying;
      state.isPlaying = false;
      musicEngine.stopPreview();
      exportCancelled = false;

      const modal = document.getElementById("exportModal");
      document.getElementById("exportProgressView").style.display = "block";
      document.getElementById("exportResultView").style.display = "none";
      document.getElementById("exportModalTitle").textContent = "🎬 正在製作 MP4 賀卡影片";
      modal.classList.add("open");
      updateExportUI(2, "檢查瀏覽器硬體編碼支援度...");

      const ratio = RATIOS[state.ratioKey];
      const fps = 30;
      try {
        let result = null;
        try {
          result = await exportWithWebCodecs(ratio.w, ratio.h, state.duration, fps);
        } catch (err) {
          if (err && err.message === "CANCELLED") throw err;
          console.warn("WebCodecs 匯出失敗，切換至 MediaRecorder 備援：", err);
        }

        if (!result && !exportCancelled) {
          updateExportUI(5, "切換至相容模式錄製引擎...");
          result = await exportWithMediaRecorder(ratio.w, ratio.h, state.duration, fps);
        }

        if (exportCancelled || !result) throw new Error("CANCELLED");
        showExportResult(result.blob, result.ext, result.codecLabel, ratio.w, ratio.h);
      } catch (err) {
        if (err && err.message === "CANCELLED") {
          modal.classList.remove("open");
          showToast("已取消匯出");
        } else {
          document.getElementById("exportStatusText").textContent = "匯出失敗：" + (err.message || err);
        }
      } finally {
        if (wasPlaying) {
          state.isPlaying = true;
          updatePlayButtonUI();
        }
      }
    }

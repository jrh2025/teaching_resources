          <div class="control-row"><span class="control-label">飄落速度</span><input id="ptSpdR" type="range" min="0.4" max="2.0" step="0.1" value="${state.particleSpeed}"><span class="control-val">${state.particleSpeed.toFixed(1)}x</span></div>
        `;
        container.appendChild(ptCtrl);
        ptCtrl.querySelector("#ptDenR").oninput = (e) => { state.particleDensity = parseFloat(e.target.value); e.target.nextElementSibling.textContent = `${Math.round(state.particleDensity*100)}%`; };
        ptCtrl.querySelector("#ptSpdR").oninput = (e) => { state.particleSpeed = parseFloat(e.target.value); e.target.nextElementSibling.textContent = `${state.particleSpeed.toFixed(1)}x`; };

        const ptGrid = document.createElement("div"); ptGrid.className = "grid-3"; ptGrid.style.marginBottom = "14px";
        PARTICLES.forEach(pt => {
          const card = document.createElement("div");
          card.className = `item-card ${state.particleId === pt.id ? "selected" : ""}`;
          const c = createMiniCanvas(110, 84);
          const cctx = c.getContext("2d");
          cctx.fillStyle = "#0f172a"; cctx.fillRect(0, 0, 110, 84);
          pt.draw(cctx, 110, 84, 1.0, 0.8, 1);
          const lbl = document.createElement("div"); lbl.className = "item-label"; lbl.textContent = pt.name;
          card.append(c, lbl);
          card.onclick = () => { state.particleId = pt.id; pushHistory(); renderActiveTabPanel(); };
          ptGrid.appendChild(card);
        });
        container.appendChild(ptGrid);

        const frHeader = document.createElement("div"); frHeader.className = "section-header"; frHeader.textContent = "🖼️ 賀卡外框裝飾 (12款)";
        container.appendChild(frHeader);
        const frGrid = document.createElement("div"); frGrid.className = "grid-3";
        FRAMES.forEach(fr => {
          const card = document.createElement("div");
          card.className = `item-card ${state.frameId === fr.id ? "selected" : ""}`;
          const c = createMiniCanvas(110, 110);
          const cctx = c.getContext("2d");
          cctx.fillStyle = "#1e293b"; cctx.fillRect(0, 0, 110, 110);
          fr.draw(cctx, 110, 110, 1.0);
          const lbl = document.createElement("div"); lbl.className = "item-label"; lbl.textContent = fr.name;
          card.append(c, lbl);
          card.onclick = () => { state.frameId = fr.id; pushHistory(); renderActiveTabPanel(); };
          frGrid.appendChild(card);
        });
        container.appendChild(frGrid);
      }

      else if (state.activeTab === "text") {
        titleEl.textContent = "✍️ 新增文字、本機字體與祝福語";
        const addBtn = document.createElement("button");
        addBtn.className = "btn-primary";
        addBtn.innerHTML = "＋ 新增祝福文字";
        addBtn.onclick = () => {
          const item = tplText("聖誕快樂\nMerry Christmas!", 0.5, 0.5, { fontId: "noto-serif", fontSize: 44, gradientId: "royal-gold", textAnim: "shimmer" });
          state.elements.push(item); state.selectedId = item.id;
          pushHistory(); refreshInspectorAndQuickBar(); openEditModalForElement(item);
        };
        container.appendChild(addBtn);

        const fontBox = document.createElement("div"); fontBox.className = "control-box";
        fontBox.innerHTML = `
          <div style="font-size:12px; font-weight:700; color:var(--xmas-gold); margin-bottom:6px;">🔤 匯入電腦 / 手機自己的字體</div>
          <div style="display:flex; gap:6px; margin-bottom:6px;">
            <button id="upFontBtn" class="btn-secondary" style="flex:1;">📁 上傳字體檔 (.ttf/.otf)</button>
            <button id="scanLocalFontBtn" class="btn-secondary" style="flex:1;">💻 讀取本機字體</button>
          </div>
          <div style="display:flex; gap:6px;">
            <input id="customFontNameIn" class="text-input" placeholder="輸入系統字體名 (如 標楷體, Arial)" style="flex:1; font-size:12px; padding:6px 8px;" />
            <button id="applySysFontBtn" class="chip active" style="border-radius:8px;">套用</button>
          </div>
        `;
        container.appendChild(fontBox);
        fontBox.querySelector("#upFontBtn").onclick = () => document.getElementById("fontFileInput").click();
        fontBox.querySelector("#scanLocalFontBtn").onclick = loadSystemInstalledFonts;
        fontBox.querySelector("#applySysFontBtn").onclick = () => {
          const name = fontBox.querySelector("#customFontNameIn").value.trim();
          if (!name) return showToast("請輸入字體名稱");
          registerAndApplyFont(name, `"${name}", sans-serif`);
        };

        const selEl = state.elements.find(e => e.id === state.selectedId && e.type === "text");
        if (selEl) {
          const editBox = document.createElement("div");
          renderElementInspector(editBox, selEl);
          container.appendChild(editBox);
        }

        const blHeader = document.createElement("div"); blHeader.className = "section-header"; blHeader.innerHTML = "<span>💡 祝福語靈感庫 (點擊一鍵套用)</span>";
        container.appendChild(blHeader);

        const cats = [...new Set(BLESSINGS.map(b => b.cat))];
        const chipRow = document.createElement("div"); chipRow.className = "chip-row";
        cats.forEach(cat => {
          const b = document.createElement("button");
          b.className = `chip ${state.activeBlessingCat === cat ? "active" : ""}`;
          b.textContent = cat;
          b.onclick = () => { state.activeBlessingCat = cat; renderActiveTabPanel(); };
          chipRow.appendChild(b);
        });
        container.appendChild(chipRow);

        BLESSINGS.filter(b => b.cat === state.activeBlessingCat).forEach(b => {
          const card = document.createElement("div");
          card.className = "control-box";
          card.style.cursor = "pointer";
          card.innerHTML = `<div style="font-size:12px; line-height:1.5; white-space:pre-line; color:#f8fafc;">${b.text}</div>`;
          card.onclick = () => {
            const cur = state.elements.find(e => e.id === state.selectedId && e.type === "text");
            if (cur) { cur.text = b.text; pushHistory(); showToast("已更新選中文字內容"); }
            else {
              const item = tplText(b.text, 0.5, 0.55, { fontId: "noto-serif", fontSize: 38, gradientId: "champagne" });
              state.elements.push(item); state.selectedId = item.id; pushHistory(); showToast("已新增祝福文字");
            }
            refreshInspectorAndQuickBar();
          };
          container.appendChild(card);
        });
      }

      else if (state.activeTab === "music") {
        titleEl.textContent = "🎵 音樂設定、起始點與圖層";
        const activeBuf = musicEngine.getActiveBuffer(state.musicId);
        const maxOffset = activeBuf ? Math.max(0, Math.floor(activeBuf.duration - 1)) : 180;
        const curTrackObj = MUSIC_TRACKS.find(t => t.id === state.musicId);
        const canSeek = state.musicId === "custom" || (curTrackObj && curTrackObj.mp3Url);

        const durBox = document.createElement("div"); durBox.className = "control-box";
        durBox.innerHTML = `
          <div class="control-row">
            <span class="control-label">影片長度</span>
            <div style="display:flex; gap:6px;">
              ${[6, 10, 15].map(sec => `<button class="chip ${state.duration === sec ? "active" : ""}" data-sec="${sec}">${sec} 秒</button>`).join("")}
            </div>
          </div>
          <div class="control-row">
            <span class="control-label">音樂音量</span>
            <input id="volRange" type="range" min="0" max="1" step="0.05" value="${state.musicVolume}">
            <span class="control-val">${Math.round(state.musicVolume*100)}%</span>
          </div>
          <button id="uploadAudioBtn" class="btn-secondary" style="margin-top:6px;">🎧 上傳自訂 MP3 / WAV 配樂</button>
        `;
        container.appendChild(durBox);
        durBox.querySelectorAll("[data-sec]").forEach(btn => {
          btn.onclick = () => {
            state.duration = parseInt(btn.dataset.sec, 10);
            document.getElementById("timeSlider").max = state.duration;
            pushHistory(); renderActiveTabPanel();
          };
        });
        durBox.querySelector("#volRange").oninput = (e) => {
          state.musicVolume = parseFloat(e.target.value);
          musicEngine.setVolume(state.musicVolume);
          e.target.nextElementSibling.textContent = `${Math.round(state.musicVolume*100)}%`;
        };
        durBox.querySelector("#uploadAudioBtn").onclick = () => document.getElementById("audioFileInput").click();

        // 音樂起始播放點剪輯盒
        if (canSeek || musicEngine.customBuffer) {
          const seekBox = document.createElement("div"); seekBox.className = "control-box";
          const fmtSec = (s) => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
          const safeVal = Math.min(state.musicStartOffset || 0, maxOffset);
          seekBox.innerHTML = `
            <div style="font-size:12px; font-weight:700; color:var(--xmas-gold); margin-bottom:6px;">
              ✂️ 音樂起始播放點 ${activeBuf ? `(全長 ${fmtSec(activeBuf.duration)})` : "(點擊曲目即可讀取長度)"}
            </div>
            <div class="control-row">
              <span class="control-label">從第幾秒</span>
              <input id="startOffsetRange" type="range" min="0" max="${maxOffset}" step="1" value="${safeVal}">
              <input id="startOffsetNum" type="number" min="0" max="${maxOffset}" value="${safeVal}" class="text-input" style="width:58px; padding:4px 6px; font-size:12px; text-align:center;">
              <span class="control-val">${fmtSec(safeVal)}</span>
            </div>
            <div style="display:flex; gap:6px; margin-top:6px;">
              <button id="previewFromOffsetBtn" class="btn-secondary" style="flex:2;">▶ 從 ${fmtSec(safeVal)} 處試聽</button>
              <button id="resetOffsetBtn" class="btn-secondary" style="flex:1;">↺ 歸零</button>
            </div>
          `;
          container.appendChild(seekBox);
          const rangeEl = seekBox.querySelector("#startOffsetRange");
          const numEl = seekBox.querySelector("#startOffsetNum");
          const valEl = seekBox.querySelector(".control-val");
          const pBtn = seekBox.querySelector("#previewFromOffsetBtn");
          const syncOffset = (v, commit = false) => {
            const clamped = clamp(parseFloat(v) || 0, 0, maxOffset);
            state.musicStartOffset = clamped;
            rangeEl.value = clamped; numEl.value = clamped;
            valEl.textContent = fmtSec(clamped);
            pBtn.textContent = `▶ 從 ${fmtSec(clamped)} 處試聽`;
            if (commit) pushHistory();
          };
          rangeEl.oninput = (e) => syncOffset(e.target.value, false);
          rangeEl.onchange = () => { syncOffset(rangeEl.value, true); musicEngine.startPreview(state.musicId, state.musicStartOffset); };
          numEl.onchange = (e) => { syncOffset(e.target.value, true); musicEngine.startPreview(state.musicId, state.musicStartOffset); };
          pBtn.onclick = () => musicEngine.startPreview(state.musicId, state.musicStartOffset);
          seekBox.querySelector("#resetOffsetBtn").onclick = () => { syncOffset(0, true); musicEngine.startPreview(state.musicId, 0); };
        }

        if (musicEngine.customBuffer) {
          const row = document.createElement("div");
          row.className = `layer-item ${state.musicId === "custom" ? "selected" : ""}`;
          row.innerHTML = `<span class="layer-name">🎧 我的自訂上傳音樂</span><span style="font-size:11px; color:var(--xmas-gold);">${state.musicId === "custom" ? "✓ 使用中" : "選用"}</span>`;
          row.onclick = () => { state.musicId = "custom"; musicEngine.startPreview("custom", state.musicStartOffset); pushHistory(); renderActiveTabPanel(); };
          container.appendChild(row);
        }

        const bcHeader = document.createElement("div"); bcHeader.className = "section-header";
        bcHeader.innerHTML = `<span>🌐 BreakingCopyright 聖誕配樂</span><a href="https://breakingcopyright.com/zh/christmas" target="_blank" rel="noopener" style="font-size:11px; color:var(--accent-blue); text-decoration:none;">官網授權 ↗</a>`;
        container.appendChild(bcHeader);

        MUSIC_TRACKS.filter(t => t.mp3Url).forEach(tr => {
          const row = document.createElement("div");
          row.className = `layer-item ${state.musicId === tr.id ? "selected" : ""}`;
          row.innerHTML = `
            <div style="flex:1; min-width:0;">
              <div class="layer-name">${tr.name}</div>
              <div style="font-size:10px; color:var(--text-muted);">${tr.license}</div>
            </div>
            <span style="font-size:11px; color:var(--xmas-gold);">${state.musicId === tr.id ? "✓ 使用中" : "選用"}</span>
          `;
          row.onclick = () => {
            state.musicId = tr.id;
            state.musicStartOffset = 0;
            musicEngine.startPreview(tr.id, 0);
            pushHistory(); renderActiveTabPanel();
          };
          container.appendChild(row);
        });

        const mHeader = document.createElement("div"); mHeader.className = "section-header"; mHeader.style.marginTop = "10px"; mHeader.textContent = "🎼 內建離線合成配樂 (點擊試聽選用)";
        container.appendChild(mHeader);
        MUSIC_TRACKS.filter(t => !t.mp3Url).forEach(tr => {
          const row = document.createElement("div");
          row.className = `layer-item ${state.musicId === tr.id ? "selected" : ""}`;
          row.innerHTML = `<span class="layer-name">${tr.name}</span><span style="font-size:11px; color:var(--xmas-gold);">${state.musicId === tr.id ? "✓ 使用中" : "選用"}</span>`;
          row.onclick = () => {
            state.musicId = tr.id;
            musicEngine.startPreview(tr.id, 0);
            pushHistory(); renderActiveTabPanel();
          };
          container.appendChild(row);
        });

        const lHeader = document.createElement("div"); lHeader.className = "section-header"; lHeader.style.marginTop = "12px"; lHeader.textContent = "📚 圖層順序管理";
        container.appendChild(lHeader);
        renderLayerList(container);
      }
    }

    function renderLayerList(container) {
      if (!state.elements.length) {
        const empty = document.createElement("div");
        empty.style.cssText = "font-size:12px; color:var(--text-muted); padding:10px; text-align:center;";
        empty.textContent = "畫布目前沒有元件，請從左側新增樣板或貼圖！";
        container.appendChild(empty);
        return;
      }
      for (let i = state.elements.length - 1; i >= 0; i--) {
        const el = state.elements[i];
        const row = document.createElement("div");
        row.className = `layer-item ${state.selectedId === el.id ? "selected" : ""}`;
        let label = "貼圖元件";
        if (el.type === "text") label = `文字：${(el.text || "").replace(/\n/g, " ")}`;
        else if (el.type === "static") label = STATIC_STICKERS.find(s => s.id === el.stickerId)?.name || "靜態貼圖";
        else if (el.type === "animated") label = "✨ " + (ANIMATED_STICKERS.find(s => s.id === el.stickerId)?.name || "動態貼圖");
        else if (el.type === "custom-image") label = "🖼️ 自訂相片貼圖";

        row.innerHTML = `
          <span class="layer-name">${label}</span>
          <button class="mini-btn" data-act="up" title="上移">↑</button>
          <button class="mini-btn" data-act="dn" title="下移">↓</button>
          <button class="mini-btn danger" data-act="del" title="刪除">✕</button>
        `;
        row.onclick = (ev) => {
          const act = ev.target.dataset?.act;
          if (act === "up" && i < state.elements.length - 1) {
            [state.elements[i], state.elements[i + 1]] = [state.elements[i + 1], state.elements[i]];
            pushHistory(); refreshInspectorAndQuickBar(); renderActiveTabPanel();
          } else if (act === "dn" && i > 0) {
            [state.elements[i], state.elements[i - 1]] = [state.elements[i - 1], state.elements[i]];
            pushHistory(); refreshInspectorAndQuickBar(); renderActiveTabPanel();
          } else if (act === "del") {
            deleteElement(el.id); renderActiveTabPanel();
          } else if (!act) {
            state.selectedId = el.id; refreshInspectorAndQuickBar();
          }
        };
        container.appendChild(row);
      }
    }

    function renderElementInspector(container, el) {
      container.innerHTML = "";
      if (!el) {
        const tip = document.createElement("div");
        tip.className = "control-box";
        tip.innerHTML = `<div style="font-size:12px; color:var(--text-secondary); line-height:1.6;">👆 點擊畫布上的任何文字或貼圖即可調整細節；在手機上支援<strong>單指拖曳</strong>與<strong>雙指縮放旋轉</strong>！</div>`;
        container.appendChild(tip);
        const lh = document.createElement("div"); lh.className = "section-header"; lh.textContent = "📚 畫布圖層列表";
        container.appendChild(lh);
        renderLayerList(container);
        return;
      }

      if (el.type === "text") {
        const box = document.createElement("div"); box.className = "control-box";
        box.innerHTML = `
          <div style="font-size:12px; font-weight:700; color:var(--xmas-gold); margin-bottom:6px;">📝 祝福文字內容</div>
          <textarea id="insTextArea" class="text-input" rows="3" style="margin-bottom:8px;">${el.text || ""}</textarea>
          <div class="control-row"><span class="control-label">字體選擇</span>
            <select id="insFontSel" class="select-input" style="flex:1;">
              ${FONTS.map(f => `<option value="${f.id}" ${el.fontId === f.id ? "selected" : ""}>${f.name}</option>`).join("")}
            </select>
          </div>
          <div style="display:flex; gap:6px; margin-bottom:8px;">
            <button id="insUpFontBtn" class="btn-secondary" style="flex:1; padding:6px;">📁 上傳字體檔</button>
            <button id="insSysFontBtn" class="btn-secondary" style="flex:1; padding:6px;">💻 本機已裝字體</button>
          </div>
          <div class="control-row"><span class="control-label">字級大小</span><input id="insFSize" type="range" min="18" max="96" value="${el.fontSize || 42}"><span class="control-val">${el.fontSize || 42}</span></div>
          <div class="control-row"><span class="control-label">金屬漸層</span>
            <select id="insGradSel" class="select-input" style="flex:1;">
              ${TEXT_GRADIENTS.map(g => `<option value="${g.id}" ${el.gradientId === g.id ? "selected" : ""}>${g.name}</option>`).join("")}
            </select>
          </div>
          <div class="control-row"><span class="control-label">純色字色</span><input id="insColor" type="color" value="${el.color || "#ffffff"}" style="width:44px; height:28px; border:none; background:transparent; cursor:pointer;">
            <span class="control-label">描邊粗細</span><input id="insStrokeW" type="range" min="0" max="8" step="0.5" value="${el.strokeWidth ?? 3}">
          </div>
          <div class="control-row"><span class="control-label">發光強度</span><input id="insGlow" type="range" min="0" max="30" step="2" value="${el.glowBlur ?? 12}"><span class="control-val">${el.glowBlur ?? 12}</span></div>
          <div class="control-row"><span class="control-label">底框橫幅</span>
            <select id="insBannerSel" class="select-input" style="flex:1;">
              ${TEXT_BANNERS.map(b => `<option value="${b.id}" ${el.bannerId === b.id ? "selected" : ""}>${b.name}</option>`).join("")}
            </select>
          </div>
          <div class="control-row"><span class="control-label">文字動畫</span>
            <select id="insTAnimSel" class="select-input" style="flex:1;">
              ${TEXT_ANIMATIONS.map(a => `<option value="${a.id}" ${el.textAnim === a.id ? "selected" : ""}>${a.name}</option>`).join("")}
            </select>
          </div>
        `;
        container.appendChild(box);
        box.querySelector("#insTextArea").oninput = (e) => { el.text = e.target.value; };
        box.querySelector("#insTextArea").onchange = () => pushHistory();
        box.querySelector("#insFontSel").onchange = (e) => { el.fontId = e.target.value; pushHistory(); };
        box.querySelector("#insUpFontBtn").onclick = () => document.getElementById("fontFileInput").click();
        box.querySelector("#insSysFontBtn").onclick = loadSystemInstalledFonts;
        box.querySelector("#insFSize").oninput = (e) => { el.fontSize = parseInt(e.target.value, 10); e.target.nextElementSibling.textContent = el.fontSize; };
        box.querySelector("#insFSize").onchange = () => pushHistory();
        box.querySelector("#insGradSel").onchange = (e) => { el.gradientId = e.target.value; pushHistory(); };
        box.querySelector("#insColor").oninput = (e) => { el.color = e.target.value; el.gradientId = "none"; box.querySelector("#insGradSel").value = "none"; };
        box.querySelector("#insStrokeW").oninput = (e) => { el.strokeWidth = parseFloat(e.target.value); };
        box.querySelector("#insGlow").oninput = (e) => { el.glowBlur = parseInt(e.target.value, 10); e.target.nextElementSibling.textContent = el.glowBlur; };
        box.querySelector("#insBannerSel").onchange = (e) => { el.bannerId = e.target.value; pushHistory(); };
        box.querySelector("#insTAnimSel").onchange = (e) => { el.textAnim = e.target.value; pushHistory(); };
      }

      if (el.type === "custom-image") {
        const cropBox = document.createElement("div"); cropBox.className = "control-box";
        const curShape = el.cropShape || "original-clean";
        const isOrig = curShape.startsWith("original") || curShape === "rect";
        cropBox.innerHTML = `
          <div class="control-row"><span class="control-label">相片圖框</span>
            <select id="insCropSel" class="select-input" style="flex:1;">
              ${PHOTO_FRAMES.map(pf => `<option value="${pf.id}" ${curShape === pf.id ? "selected" : ""}>${pf.name}</option>`).join("")}
            </select>
          </div>
          ${!isOrig ? `
            <div class="control-row"><span class="control-label">框內縮放</span><input id="insPZoom" type="range" min="1" max="2.5" step="0.05" value="${el.photoZoom || 1}"><span class="control-val">${(el.photoZoom || 1).toFixed(2)}x</span></div>
            <div class="control-row"><span class="control-label">左右微調</span><input id="insPPanX" type="range" min="-1" max="1" step="0.05" value="${el.photoPanX || 0}"><span class="control-val">${Math.round((el.photoPanX || 0)*100)}%</span></div>
            <div class="control-row"><span class="control-label">上下微調</span><input id="insPPanY" type="range" min="-1" max="1" step="0.05" value="${el.photoPanY || 0}"><span class="control-val">${Math.round((el.photoPanY || 0)*100)}%</span></div>
          ` : `<div style="font-size:11px; color:var(--text-muted);">✓ 使用原始長寬比等比呈現，絕不裁切變形</div>`}
        `;
        container.appendChild(cropBox);
        cropBox.querySelector("#insCropSel").onchange = (e) => { el.cropShape = e.target.value; pushHistory(); refreshInspectorAndQuickBar(); };
        if (!isOrig) {
          cropBox.querySelector("#insPZoom").oninput = (e) => { el.photoZoom = parseFloat(e.target.value); e.target.nextElementSibling.textContent = `${el.photoZoom.toFixed(2)}x`; };
          cropBox.querySelector("#insPPanX").oninput = (e) => { el.photoPanX = parseFloat(e.target.value); e.target.nextElementSibling.textContent = `${Math.round(el.photoPanX*100)}%`; };
          cropBox.querySelector("#insPPanY").oninput = (e) => { el.photoPanY = parseFloat(e.target.value); e.target.nextElementSibling.textContent = `${Math.round(el.photoPanY*100)}%`; };
        }
      }

      // 共用變換與動態軌跡屬性
      const commonBox = document.createElement("div"); commonBox.className = "control-box";
      commonBox.innerHTML = `
        <div class="control-row"><span class="control-label">縮放比例</span><input id="insScale" type="range" min="0.3" max="2.8" step="0.05" value="${el.scale || 1}"><span class="control-val">${(el.scale || 1).toFixed(2)}x</span></div>
        <div class="control-row"><span class="control-label">旋轉角度</span><input id="insRot" type="range" min="-180" max="180" step="2" value="${Math.round(((el.rotation || 0) * 180) / Math.PI)}"><span class="control-val">${Math.round(((el.rotation || 0) * 180) / Math.PI)}°</span></div>
        <div class="control-row"><span class="control-label">透明度</span><input id="insOpa" type="range" min="0.1" max="1" step="0.05" value="${el.opacity ?? 1}"><span class="control-val">${Math.round((el.opacity ?? 1) * 100)}%</span></div>
        <div class="control-row"><span class="control-label">動態軌跡</span>
          <select id="insMotionSel" class="select-input" style="flex:1;">
            ${ELEMENT_MOTIONS.map(m => `<option value="${m.id}" ${(el.motion || "none") === m.id ? "selected" : ""}>${m.name}</option>`).join("")}
          </select>
        </div>
        <label style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-secondary); margin:4px 0 8px; cursor:pointer;">
          <input id="insFreezeChk" type="checkbox" ${el.freezeAnim ? "checked" : ""} style="accent-color:var(--xmas-gold); width:16px; height:16px;">
          <span>🔒 完全靜止不動 (停止軌跡與內部小動畫)</span>
        </label>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px;">
          <button id="insFlipBtn" class="btn-secondary" style="${el.flipX ? "border-color:var(--xmas-gold); color:var(--xmas-gold);" : ""}">⇄ 水平翻轉 ${el.flipX ? "✓" : ""}</button>
          <button id="insFlipYBtn" class="btn-secondary" style="${el.flipY ? "border-color:var(--xmas-gold); color:var(--xmas-gold);" : ""}">⇅ 垂直翻轉 ${el.flipY ? "✓" : ""}</button>
          <button id="insDupBtn" class="btn-secondary">⧉ 複製元件</button>
          <button id="insDelBtn" class="btn-secondary" style="color:#fda4af;">✕ 刪除</button>
        </div>
      `;
      container.appendChild(commonBox);
      commonBox.querySelector("#insScale").oninput = (e) => { el.scale = parseFloat(e.target.value); e.target.nextElementSibling.textContent = `${el.scale.toFixed(2)}x`; };
      commonBox.querySelector("#insScale").onchange = () => pushHistory();
      commonBox.querySelector("#insRot").oninput = (e) => { const deg = parseInt(e.target.value, 10); el.rotation = (deg * Math.PI) / 180; e.target.nextElementSibling.textContent = `${deg}°`; };
      commonBox.querySelector("#insRot").onchange = () => pushHistory();
      commonBox.querySelector("#insOpa").oninput = (e) => { el.opacity = parseFloat(e.target.value); e.target.nextElementSibling.textContent = `${Math.round(el.opacity*100)}%`; };
      commonBox.querySelector("#insMotionSel").onchange = (e) => { el.motion = e.target.value; if (el.motion !== "none") el.freezeAnim = false; pushHistory(); refreshInspectorAndQuickBar(); };
      commonBox.querySelector("#insFreezeChk").onchange = (e) => {
        el.freezeAnim = e.target.checked;
        if (el.freezeAnim) el.motion = "none";
        pushHistory(); refreshInspectorAndQuickBar();
      };
      commonBox.querySelector("#insFlipBtn").onclick = () => { el.flipX = !el.flipX; pushHistory(); refreshInspectorAndQuickBar(); };
      commonBox.querySelector("#insFlipYBtn").onclick = () => { el.flipY = !el.flipY; pushHistory(); refreshInspectorAndQuickBar(); };
      commonBox.querySelector("#insDupBtn").onclick = () => duplicateElement(el);
      commonBox.querySelector("#insDelBtn").onclick = () => deleteElement(el.id);
    }

    function registerAndApplyFont(displayName, cssFamily, fontId = null) {
      const id = fontId || `custom_${Date.now().toString(36)}`;
      if (!FONTS.some(f => f.id === id)) {
        FONTS.unshift({ id, name: `⭐ ${displayName}`, family: cssFamily, weight: "700" });
      }
      const selEl = state.elements.find(e => e.id === state.selectedId && e.type === "text");
      if (selEl) { selEl.fontId = id; pushHistory(); }
      refreshInspectorAndQuickBar();
      if (document.getElementById("editModal").classList.contains("open") && selEl) {
        renderElementInspector(document.getElementById("editModalBody"), selEl);
      }
      showToast(`已套用字體「${displayName}」`);
    }

    async function loadSystemInstalledFonts() {
      if (!window.queryLocalFonts) {
        showToast("此瀏覽器不支援自動掃描，請使用「上傳字體檔」或直接輸入系統字體名");
        return;
      }
      try {
        const list = await window.queryLocalFonts();
        const families = [...new Set(list.map(f => f.family))].slice(0, 60);
        if (!families.length) return showToast("未取得本機字體列表");
        let added = 0;
        families.forEach(fam => {
          const id = `local_${fam.replace(/\W+/g, "_")}`;
          if (!FONTS.some(f => f.id === id)) {
            FONTS.push({ id, name: `💻 ${fam}`, family: `"${fam}", sans-serif`, weight: "700" });
            added++;
          }
        });
        refreshInspectorAndQuickBar();
        showToast(`已匯入 ${added} 款本機安裝字體，請至字體下拉選單選用！`);
      } catch (e) {
        showToast("存取本機字體被拒絕，您仍可透過「上傳字體檔」載入 TTF/OTF");
      }
    }

    function openEditModalForElement(el) {
      const modal = document.getElementById("editModal");
      document.getElementById("editModalTitle").textContent = el.type === "text" ? "✏️ 編輯文字與特效" : "🛠️ 調整元件屬性";
      renderElementInspector(document.getElementById("editModalBody"), el);
      modal.classList.add("open");
    }

    function refreshInspectorAndQuickBar() {
      const selEl = state.elements.find(e => e.id === state.selectedId) || null;
      renderElementInspector(document.getElementById("inspectorContent"), selEl);
      const qBar = document.getElementById("mobileQuickBar");
      if (selEl) qBar.classList.add("visible");
      else qBar.classList.remove("visible");
      if (state.activeTab === "text" || state.activeTab === "music") renderActiveTabPanel();
    }

    function refreshAllPanels() {
      renderActiveTabPanel();
      refreshInspectorAndQuickBar();
    }

    /* ==========================================================================
       15. 畫布自適應縮放、主動畫迴圈與事件綁定
       ========================================================================== */
    function syncViewportHeight() {
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty("--app-h", `${Math.round(vh)}px`);
    }

    function resizeStageCanvas() {
      const ratio = RATIOS[state.ratioKey];
      canvas.width = ratio.w;
      canvas.height = ratio.h;

      const stage = document.getElementById("stagePane");
      const availW = Math.max(150, stage.clientWidth - 20);
      const availH = Math.max(110, stage.clientHeight - 50);
      const scale = Math.min(availW / ratio.w, availH / ratio.h);

      canvasContainer.style.width = `${Math.floor(ratio.w * scale)}px`;
      canvasContainer.style.height = `${Math.floor(ratio.h * scale)}px`;
    }

    function updatePlayButtonUI() {
      const btn = document.getElementById("playPauseBtn");
      btn.textContent = state.isPlaying ? "❚❚" : "▶";
    }

    // 檔案上傳處理 (背景相片、貼圖相片、自訂音樂)
    function loadImageFile(file, cb) {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const key = `img_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
          customImageCache.set(key, img);
          cb(key);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    document.getElementById("bgFileInput").onchange = (e) => {
      const f = e.target.files[0];
      if (f) loadImageFile(f, (key) => { state.customBgImage = key; pushHistory(); renderActiveTabPanel(); showToast("已套用自訂背景照片"); });
      e.target.value = "";
    };

    document.getElementById("stickerFileInput").onchange = (e) => {
      const f = e.target.files[0];
      if (f) loadImageFile(f, (key) => {
        const item = { id: nextId("ci"), type: "custom-image", imageUrl: key, cropShape: "original-clean", photoZoom: 1, photoPanX: 0, photoPanY: 0, x: 0.5, y: 0.5, scale: 1.15, rotation: 0, opacity: 1, flipX: false, flipY: false, freezeAnim: true, motion: "none" };
        state.elements.push(item); state.selectedId = item.id;
        pushHistory(); refreshInspectorAndQuickBar(); showToast("已新增不變形相片貼圖 (可在屬性中選12款圖框)");
      });
      e.target.value = "";
    };

    document.getElementById("fontFileInput").onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      try {
        const baseName = f.name.replace(/\.[^.]+$/, "");
        const family = `UserFont_${Date.now().toString(36)}`;
        const buf = await f.arrayBuffer();
        const face = new FontFace(family, buf);
        await face.load();
        document.fonts.add(face);
        registerAndApplyFont(baseName, `"${family}", sans-serif`, family);
      } catch (err) {
        showToast("字體檔載入失敗，請確認格式為 TTF / OTF / WOFF");
      }
      e.target.value = "";
    };

    document.getElementById("audioFileInput").onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      try {
        musicEngine.ensureContext();
        const arr = await f.arrayBuffer();
        musicEngine.customBuffer = await musicEngine.ctx.decodeAudioData(arr);
        state.musicId = "custom";
        state.musicStartOffset = 0;
        musicEngine.startPreview("custom", 0);
        pushHistory(); renderActiveTabPanel();
        showToast(`已載入音樂：${f.name} (可設定起始播放點)`);
      } catch (err) {
        showToast("無法解析此音訊檔，請改用 MP3 / WAV / M4A");
      }
      e.target.value = "";
    };

    // 導覽列切換 (手機端點擊分頁若抽屜已收合則自動開啟)
    let drawerState = 0; // 0: 半高, 1: 展開, 2: 收合
    document.getElementById("navTabs").addEventListener("click", (e) => {
      const tabBtn = e.target.closest(".nav-tab");
      if (!tabBtn) return;
      document.querySelectorAll(".nav-tab").forEach(b => b.classList.remove("active"));
      tabBtn.classList.add("active");
      state.activeTab = tabBtn.dataset.tab;
      const pane = document.getElementById("libraryPane");
      if (pane.classList.contains("collapsed")) {
        pane.classList.remove("collapsed");
        drawerState = 0;
        document.getElementById("drawerToggleText").textContent = "展開 / 收合";
        setTimeout(resizeStageCanvas, 260);
      }
      renderActiveTabPanel();
    });

    // 手機底部抽屜高度切換 (半高 -> 展開 -> 收合)
    document.getElementById("drawerHandleBar").onclick = () => {
      const pane = document.getElementById("libraryPane");
      const txt = document.getElementById("drawerToggleText");
      drawerState = (drawerState + 1) % 3;
      pane.classList.remove("expanded", "collapsed");
      if (drawerState === 1) { pane.classList.add("expanded"); txt.textContent = "收合面板"; }
      else if (drawerState === 2) { pane.classList.add("collapsed"); txt.textContent = "展開面板"; }
      else { txt.textContent = "展開 / 收合"; }
      setTimeout(resizeStageCanvas, 260);
    };

    // 頂部工具列與手機快捷列事件
    document.getElementById("ratioSelect").onchange = (e) => { state.ratioKey = e.target.value; resizeStageCanvas(); pushHistory(); };
    document.getElementById("undoBtn").onclick = undo;
    document.getElementById("redoBtn").onclick = redo;
    document.getElementById("muteBtn").onclick = (e) => {
      const muted = musicEngine.toggleMute();
      e.currentTarget.textContent = muted ? "🔇" : "🔊";
      e.currentTarget.classList.toggle("active", muted);
    };
    function cancelActiveExport() {
      exportCancelled = true;
      document.getElementById("exportModal").classList.remove("open");
      if (activeExportAbort) { try { activeExportAbort(); } catch (_) {} }
    }
    document.getElementById("exportBtn").onclick = startExportMP4;
    document.getElementById("cancelExportBtn").onclick = cancelActiveExport;
    document.getElementById("closeExportModalBtn").onclick = cancelActiveExport;
    document.getElementById("closeEditModalBtn").onclick = () => { document.getElementById("editModal").classList.remove("open"); refreshInspectorAndQuickBar(); };

    document.getElementById("mqEditBtn").onclick = () => {
      const el = state.elements.find(i => i.id === state.selectedId);
      if (el) openEditModalForElement(el);
    };
    document.getElementById("mqUpBtn").onclick = () => { if (state.selectedId) bringElementForward(state.selectedId); };
    document.getElementById("mqDupBtn").onclick = () => {
      const el = state.elements.find(i => i.id === state.selectedId);
      if (el) duplicateElement(el);
    };
    document.getElementById("mqDelBtn").onclick = () => { if (state.selectedId) deleteElement(state.selectedId); };

    // 時間軸控制
    document.getElementById("playPauseBtn").onclick = () => {
      state.isPlaying = !state.isPlaying;
      updatePlayButtonUI();
      if (state.isPlaying && state.musicId !== "none") musicEngine.startPreview(state.musicId);
      else musicEngine.stopPreview();
    };
    document.getElementById("timeSlider").oninput = (e) => {
      state.isPlaying = false;
      updatePlayButtonUI();
      musicEngine.stopPreview();
      state.currentTime = parseFloat(e.target.value);
    };

    // 首次互動解鎖瀏覽器音訊
    window.addEventListener("pointerdown", () => {
      if (state.isPlaying && !musicEngine.isPlaying && state.musicId !== "none" && !musicEngine.muted) {
        musicEngine.startPreview(state.musicId);
      }
    }, { once: true });

    // 主動畫渲染迴圈 (60 FPS 預覽)
    let lastFrameTs = performance.now();
    function animationLoop(now) {
      const dt = Math.min(0.1, (now - lastFrameTs) / 1000);
      lastFrameTs = now;
      if (state.isPlaying) {
        state.currentTime = (state.currentTime + dt) % state.duration;
        const slider = document.getElementById("timeSlider");
        if (document.activeElement !== slider) slider.value = state.currentTime;
      }
      document.getElementById("timeReadout").textContent = `${state.currentTime.toFixed(1)}s / ${state.duration}s`;
      renderScene(ctx, state, state.currentTime, canvas.width, canvas.height, true, snapGuides);
      requestAnimationFrame(animationLoop);
    }

    // 啟動初始化
    syncViewportHeight();
    window.addEventListener("resize", () => { syncViewportHeight(); resizeStageCanvas(); });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => { syncViewportHeight(); resizeStageCanvas(); });
    }
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(resizeStageCanvas).observe(document.getElementById("stagePane"));
    }
    loadTemplate("t1", true);
    resizeStageCanvas();
    updatePlayButtonUI();
    requestAnimationFrame(animationLoop);
  })();
  </script>
</body>
</html>
